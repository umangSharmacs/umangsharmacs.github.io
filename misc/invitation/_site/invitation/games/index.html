<style>
    .section-view {
        padding: 20px;
        max-width: 900px;
        margin: 0 auto;
    }

    .section-view h1 {
        font-size: 2.5rem;
        color: #123524;
        margin-bottom: 1.5rem;
    }

    .back-btn {
        background: linear-gradient(135deg, #e8f5ed 0%, #d4ede0 100%);
        border: 2px solid #a8d5ba;
        padding: 10px 20px;
        border-radius: 12px;
        font-size: 1rem;
        cursor: pointer;
        margin-bottom: 2rem;
        transition: all 0.3s;
        color: #123524;
        font-weight: 500;
        text-decoration: none;
        display: inline-block;
    }

    .back-btn:hover {
        background: linear-gradient(135deg, #d4ede0 0%, #c8e6d3 100%);
        border-color: #123524;
        transform: translateX(-3px);
    }

    /* Knitting Game Styles */
    .knitting-game {
        background: linear-gradient(135deg, #fef5f8 0%, #fef9fb 100%);
        border-radius: 20px;
        padding: 30px;
        margin-top: 2rem;
        border: 2px solid #f5dfe8;
    }

    .game-stats {
        display: flex;
        justify-content: space-around;
        margin-bottom: 2rem;
        gap: 20px;
        flex-wrap: wrap;
    }

    .stat {
        background: linear-gradient(135deg, #f5fdf8 0%, #edf9f1 100%);
        padding: 15px 25px;
        border-radius: 12px;
        box-shadow: 0 2px 12px rgba(18, 53, 36, 0.1);
        border: 1px solid #a8d5ba;
    }

    .stat-label {
        font-weight: 600;
        color: #2a5a3f;
        margin-right: 8px;
    }

    .stat span:last-child {
        font-size: 1.3rem;
        font-weight: 700;
        color: #123524;
    }

    .knitting-needles {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
        margin: 3rem 0;
        position: relative;
    }

    .needle {
        width: 8px;
        height: 200px;
        background: linear-gradient(to bottom, #7bb896 0%, #a8d5ba 100%);
        border-radius: 4px;
        position: relative;
        box-shadow: 0 2px 8px rgba(18, 53, 36, 0.2);
    }

    .needle::before {
        content: '';
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 16px;
        height: 16px;
        background: #52a876;
        border-radius: 50%;
    }

    .left-needle {
        transform: rotate(-15deg);
    }

    .right-needle {
        transform: rotate(15deg);
    }

    .yarn-ball {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
        border-radius: 50%;
        box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
        position: relative;
        animation: yarn-pulse 2s ease-in-out infinite;
    }

    .yarn-ball::after {
        content: '🧶';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 2rem;
    }

    @keyframes yarn-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }

    .knit-btn {
        display: block;
        margin: 2rem auto;
        padding: 15px 40px;
        background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1.2rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
    }

    .knit-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
    }

    .knit-btn:active {
        transform: translateY(-1px);
    }

    .squares-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 15px;
        margin-top: 3rem;
        padding: 20px;
        background: linear-gradient(135deg, #f5fdf8 0%, #edf9f1 100%);
        border-radius: 16px;
        border: 1px solid #a8d5ba;
    }

    .knitting-square {
        aspect-ratio: 1;
        border: 2px solid #c8e6d3;
        border-radius: 12px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(135deg, #ffffff 0%, #f5fdf8 100%);
    }

    .knitting-square .stitch-row {
        height: 10%;
        width: 100%;
        background: repeating-linear-gradient(
            90deg,
            #ec4899 0px,
            #ec4899 8px,
            #f472b6 8px,
            #f472b6 16px
        );
        opacity: 0;
        animation: stitch-appear 0.3s ease-in forwards;
    }

    @keyframes stitch-appear {
        to { opacity: 1; }
    }

    .knitting-square.complete {
        border-color: #ec4899;
        box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
    }
</style>

<div class="section-view">
    <a href="/invitation/hub/" class="back-btn">← Back to Hub</a>
    <h1>🧶 Knitting Progress</h1>

    <div class="knitting-game">
        <div class="game-stats">
            <div class="stat">
                <span class="stat-label">Stitches:</span>
                <span id="stitchCount">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Squares:</span>
                <span id="squareCount">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Progress:</span>
                <span id="progressPercent">0%</span>
            </div>
        </div>

        <div class="knitting-needles">
            <div class="needle left-needle"></div>
            <div class="yarn-ball"></div>
            <div class="needle right-needle"></div>
        </div>

        <button class="knit-btn" onclick="knit()">🧶 Knit a Stitch</button>

        <div class="squares-container" id="squaresContainer">
            <!-- Squares will be generated here -->
        </div>
    </div>
</div>

<script>
    // Check authentication
    window.addEventListener('DOMContentLoaded', function() {
        if (sessionStorage.getItem('invitation_authenticated') !== 'true') {
            window.location.href = '/invitation/';
        }

        // Hide banner on section pages
        const banner = document.querySelector('.invitation-banner');
        if (banner) {
            banner.style.display = 'none';
        }
    });

    // Knitting game logic
    let stitches = 0;
    let squares = 0;
    const STITCHES_PER_SQUARE = 10;
    const MAX_SQUARES = 12;
    let currentSquareStitches = 0;
    let currentSquareElement = null;

    function knit() {
        if (squares >= MAX_SQUARES) {
            alert('🎉 You\'ve completed all the squares! You\'re a knitting master!');
            return;
        }

        stitches++;
        currentSquareStitches++;

        // Create new square if needed
        if (currentSquareStitches === 1) {
            createNewSquare();
        }

        // Add stitch to current square
        addStitchToSquare();

        // Complete square if full
        if (currentSquareStitches >= STITCHES_PER_SQUARE) {
            completeSquare();
        }

        updateStats();
    }

    function createNewSquare() {
        const container = document.getElementById('squaresContainer');
        currentSquareElement = document.createElement('div');
        currentSquareElement.className = 'knitting-square';
        container.appendChild(currentSquareElement);
    }

    function addStitchToSquare() {
        if (!currentSquareElement) return;

        const stitchRow = document.createElement('div');
        stitchRow.className = 'stitch-row';
        currentSquareElement.appendChild(stitchRow);
    }

    function completeSquare() {
        if (currentSquareElement) {
            currentSquareElement.classList.add('complete');
        }
        squares++;
        currentSquareStitches = 0;
        currentSquareElement = null;
    }

    function updateStats() {
        document.getElementById('stitchCount').textContent = stitches;
        document.getElementById('squareCount').textContent = squares;
        const progress = Math.min(100, Math.round((squares / MAX_SQUARES) * 100));
        document.getElementById('progressPercent').textContent = progress + '%';
    }
</script>
