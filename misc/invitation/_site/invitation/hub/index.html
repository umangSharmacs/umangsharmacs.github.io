<style>
    /* Hub Styles */
    .hub-view {
        padding: 20px;
        max-width: 800px;
        margin: 0 auto;
    }

    .success-message {
        position: fixed;
        top: 100px;
        right: 20px;
        background: linear-gradient(135deg, #d4ede0 0%, #c8e6d3 100%);
        border: 2px solid #52a876;
        padding: 16px 20px;
        border-radius: 12px;
        text-align: left;
        max-width: 320px;
        box-shadow: 0 8px 24px rgba(18, 53, 36, 0.25);
        z-index: 1000;
        animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
        from {
            transform: translateX(400px);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }

    .success-message.hidden {
        display: none;
    }

    .success-message h3 {
        color: #123524;
        margin-bottom: 0.3rem;
        font-size: 1rem;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .success-message p {
        color: #1a4a30;
        margin: 0;
        font-size: 0.9rem;
    }

    .close-notification {
        position: absolute;
        top: 8px;
        right: 8px;
        background: transparent;
        border: none;
        color: #123524;
        font-size: 1.3rem;
        cursor: pointer;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: all 0.2s;
        line-height: 1;
        padding: 0;
    }

    .close-notification:hover {
        background: rgba(18, 53, 36, 0.15);
        color: #1a4a30;
    }

    .hub-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 2rem;
    }

    .hub-block {
        background: linear-gradient(135deg, #f5fdf8 0%, #edf9f1 100%);
        border: 2px solid #a8d5ba;
        border-radius: 20px;
        padding: 30px 20px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
        text-decoration: none;
        display: block;
    }

    .hub-block:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 32px rgba(18, 53, 36, 0.2);
        border-color: #123524;
        background: linear-gradient(135deg, #e8f5ed 0%, #d4ede0 100%);
    }

    .block-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
        filter: drop-shadow(0 2px 4px rgba(18, 53, 36, 0.2));
    }

    .hub-block h3 {
        font-size: 1.3rem;
        color: #123524;
        margin-bottom: 0.5rem;
    }

    .hub-block p {
        color: #2a5a3f;
        font-size: 0.9rem;
        margin: 0;
    }
</style>

<div class="hub-view">
    <div class="success-message" id="welcomeNotification">
        <button class="close-notification" onclick="closeNotification()" aria-label="Close notification">×</button>
        <h3>Welcome!</h3>
        <p>Choose a section to explore</p>
    </div>

    <div class="hub-grid">
        <a href="/invitation/music/" class="hub-block">
            <div class="block-icon">🎵</div>
            <h3>Music</h3>
            <p>My favorite tunes</p>
        </a>

        <a href="/invitation/memories/" class="hub-block">
            <div class="block-icon">📸</div>
            <h3>Memories</h3>
            <p>Cherished moments</p>
        </a>

        <a href="/invitation/writings/" class="hub-block">
            <div class="block-icon">✍️</div>
            <h3>Writings</h3>
            <p>Thoughts &amp; stories</p>
        </a>

        <a href="/invitation/notes/" class="hub-block">
            <div class="block-icon">📝</div>
            <h3>Notes</h3>
            <p>Quick thoughts</p>
        </a>

        <a href="/invitation/games/" class="hub-block">
            <div class="block-icon">🎮</div>
            <h3>Games</h3>
            <p>Interactive fun</p>
        </a>
    </div>
</div>

<script>
    // Check authentication
    window.addEventListener('DOMContentLoaded', function() {
        if (sessionStorage.getItem('invitation_authenticated') !== 'true') {
            // Not authenticated, redirect to login
            window.location.href = '/invitation/';
        }
    });

    // Close notification
    function closeNotification() {
        const notification = document.getElementById('welcomeNotification');
        if (notification) {
            notification.classList.add('hidden');
        }
    }
</script>
