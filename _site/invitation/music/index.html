<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Limelight&family=Jacquard+24&family=Quintessential&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Theme Colors */
            --color-primary: #123524;
            --color-secondary: #00a767;
            --color-accent: #eefdf4;
            --color-background: #e8f3f5;
            --color-white: #ffffff;
            --color-text-primary: #e8f3f5;
            --color-text-secondary: #eefdf4;
            --color-text-muted: #718096;
            --color-nav-bg: #123524;
            --color-hover-light: #c8e6d3;
            --color-hover-dark: #0a1f16;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: var(--color-nav-bg);
            min-height: 100vh;
            position: relative;
            padding-top: 90px;
            animation: backgroundCycle 30s ease-in-out infinite;
        }

        @keyframes backgroundCycle {
            0%, 100% {
                background: #F0FCF5;
            }
            33% {
                background: #E8F3F5;
            }
            66% {
                background: #9CB0A4;
            }
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--color-nav-bg);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            box-shadow: 0 2px 20px rgba(18, 53, 36, 0.3);
            z-index: 1000;
        }

        nav .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            color: var(--color-text-primary);
            text-decoration: none;
            transition: all 0.3s;
        }

        nav .logo:hover {
            color: var(--color-hover-light);
        }

        nav .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        nav .nav-links a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }

        nav .nav-links a:hover {
            color: var(--color-hover-dark);
            background: rgba(18, 53, 36, 0.1);
        }

        /* Full-Page Hero Banner */
        .invitation-banner {
            min-height: calc(100vh - 90px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 5%;
            position: relative;
        }

        .invitation-banner h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .invitation-banner p {
            font-size: 2rem;
            color: var(--color-primary);
            font-weight: 400;
        }

        /* Scroll Down Button */
        .scroll-down-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--color-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            animation: bounce 2s infinite;
        }

        .scroll-down-btn .material-symbols-outlined {
            font-size: 3rem;
        }

        .scroll-down-btn:hover {
            transform: translateX(-50%) translateY(5px);
            color: var(--color-secondary);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(-10px);
            }
            60% {
                transform: translateX(-50%) translateY(-5px);
            }
        }

        /* Content Area */
        .invitation-main {
            min-height: calc(100vh - 300px);
            padding: 20px 5%;
        }

        /* Decorative Elements */
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            top: 10%;
            left: 10%;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--color-text-secondary) 0%, transparent 70%);
            animation-delay: 0s;
        }

        .shape-2 {
            top: 60%;
            right: 15%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, var(--color-secondary) 0%, transparent 70%);
            animation-delay: 5s;
        }

        .shape-3 {
            bottom: 20%;
            left: 20%;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, var(--color-secondary) 0%, transparent 70%);
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(20px, -20px) rotate(90deg);
            }
            50% {
                transform: translate(-15px, 15px) rotate(180deg);
            }
            75% {
                transform: translate(15px, 20px) rotate(270deg);
            }
        }

        /* Settings Dropdown */
        .settings-dropdown {
            position: relative;
        }

        .settings-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            padding: 0.5rem;
            transition: transform 0.3s;
            color: var(--color-text-primary);
        }

        .settings-btn:hover {
            transform: rotate(45deg);
        }

        .settings-icon {
            display: block;
        }

        .settings-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 0.5rem;
            background: var(--color-white);
            border-radius: 12px;
            padding: 1rem;
            min-width: 250px;
            box-shadow: 0 8px 24px rgba(18, 53, 36, 0.25);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s;
            z-index: 1001;
        }

        .settings-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .settings-item {
            padding: 0.75rem 0;
        }

        .settings-item label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            color: var(--color-primary);
            font-weight: 500;
        }

        .settings-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--color-primary);
        }

        .settings-item span {
            user-select: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            nav .nav-links {
                gap: 1rem;
                font-size: 0.9rem;
            }

            .invitation-banner h1 {
                font-size: 3.5rem;
            }

            .invitation-banner p {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            nav {
                padding: 0.8rem 5%;
            }

            nav .logo {
                font-size: 1.3rem;
            }

            nav .nav-links {
                gap: 0.5rem;
                font-size: 0.85rem;
            }

            nav .nav-links a {
                padding: 0.4rem 0.6rem;
            }

            .invitation-banner h1 {
                font-size: 2.5rem;
            }

            .invitation-banner p {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>

<script>
/* =========================
   CONFIG
========================= */
const CONFIG = {
  LANES: ['C4','D4','E4','F4','G4','A4','B4'],
  KEY_MAP: {
    KeyA:'C4', KeyS:'D4', KeyD:'E4',
    KeyF:'F4', KeyG:'G4', KeyH:'A4', KeyJ:'B4'
  },
  NOTE_TO_KEY: {
    'C4':'A', 'D4':'S', 'E4':'D',
    'F4':'F', 'G4':'G', 'A4':'H', 'B4':'J'
  },
  KEY_TO_LANE: {
    'C4': 0, 'D4': 1, 'E4': 2, 'F4': 3, 'G4': 4, 'A4': 5, 'B4': 6
  },
  NOTE_FALL_TIME: 2.0, // Seconds for note to fall from top to judgment line
  HIT_WINDOW: 0.15, // Hit window in seconds (±0.15s = 300ms total)
  CANVAS_WIDTH: 800,
  CANVAS_HEIGHT: 600,
  JUDGMENT_LINE_Y: 500, // Y position of judgment line
  NOTE_SIZE: 40
};

/* =========================
   STATE
========================= */
let currentSong = null;
let allMidiNotes = []; // All notes from MIDI file
let gameNotes = []; // Notes to display in game (simplified from MIDI)

let gameStartTime = 0;
let currentTime = 0;
let animationId = null;

let isPlaying = false;
let score = 0;
let combo = 0;

/* =========================
   AUDIO
========================= */
// Piano sampler for playing MIDI notes
const piano = new Tone.Sampler({
  urls: {
    C4: "C4.mp3",
    "D#4": "Ds4.mp3",
    "F#4": "Fs4.mp3",
    A4: "A4.mp3",
  },
  baseUrl: "https://tonejs.github.io/audio/salamander/",
}).toDestination();

// Simple synth for keyboard feedback
const synth = new Tone.Synth().toDestination();

/* =========================
   INIT
========================= */
window.addEventListener("DOMContentLoaded", init);

async function init() {
  try {
    await loadMidiFile("RiverFlowsInYou.mid");
    setupInput();
    drawIdle();
  } catch (error) {
    console.error("Initialization failed:", error);
  }
}

/* =========================
   MIDI LOADING
========================= */
async function loadMidiFile(filename) {
  try {
    // Fetch MIDI file as ArrayBuffer
    const response = await fetch(`/misc/invitation/music-assets/${filename}`);
    if (!response.ok) throw new Error(`Failed to load ${filename}`);

    const arrayBuffer = await response.arrayBuffer();

    // Parse with @tonejs/midi
    const midi = new Midi(arrayBuffer);

    // Extract metadata
    currentSong = {
      title: filename.replace('.mid', ''),
      filename: filename,
      bpm: midi.header.tempos[0]?.bpm || 120,
      timeSignature: midi.header.timeSignatures[0] || [4, 4],
      duration: midi.duration,
      chunks: []
    };

    Tone.Transport.bpm.value = currentSong.bpm;

    // Extract all notes for continuous playback
    allMidiNotes = extractNotesFromMidi(midi);

    // Generate game notes (simplified prompts every 2 beats)
    gameNotes = generateGameNotes(currentSong.bpm, currentSong.duration);

    document.getElementById("gameStatus").textContent = `Ready: ${currentSong.title}`;
    document.getElementById("loadingMessage").style.display = "none";

    return currentSong;
  } catch (error) {
    console.error("Error loading MIDI:", error);
    document.getElementById("errorMessage").textContent = `Error loading ${filename}: ${error.message}`;
    document.getElementById("errorMessage").style.display = "block";
    document.getElementById("loadingMessage").style.display = "none";
    throw error;
  }
}

function extractNotesFromMidi(midi) {
  const notes = [];

  // Merge all tracks, filter to C4-B4 range (MIDI 60-71)
  midi.tracks.forEach(track => {
    track.notes.forEach(note => {
      if (note.midi >= 60 && note.midi <= 71) {
        notes.push({
          name: note.name,           // "C4", "D4", etc.
          time: note.time,           // absolute time in seconds
          duration: note.duration,
          velocity: note.velocity
        });
      }
    });
  });

  // Sort by time and remove duplicates
  notes.sort((a, b) => a.time - b.time);
  return removeDuplicateNotes(notes);
}

function removeDuplicateNotes(notes) {
  const unique = [];
  for (let i = 0; i < notes.length; i++) {
    const current = notes[i];
    const isDuplicate = unique.some(n =>
      n.name === current.name &&
      Math.abs(n.time - current.time) < 0.01
    );
    if (!isDuplicate) unique.push(current);
  }
  return unique;
}

function generateGameNotes(bpm, duration) {
  const beatDuration = 60 / bpm;
  const noteInterval = beatDuration * 2; // Every 2 beats
  const notes = [];

  for (let time = 2; time < duration; time += noteInterval) {
    // Generate random note
    const randomLane = CONFIG.LANES[Math.floor(Math.random() * CONFIG.LANES.length)];
    notes.push({
      time: time,
      note: randomLane,
      lane: CONFIG.KEY_TO_LANE[randomLane],
      hit: false,
      missed: false
    });
  }

  return notes;
}

/* =========================
   GAME START / STOP
========================= */
async function startGame() {
  if (!currentSong || !allMidiNotes.length) {
    document.getElementById("gameStatus").textContent = "No song loaded!";
    return;
  }

  await Tone.start();
  Tone.Transport.cancel();
  Tone.Transport.position = 0;

  isPlaying = true;
  score = 0;
  combo = 0;
  gameStartTime = Tone.now() + 0.1; // Small delay to sync

  // Reset all notes
  gameNotes.forEach(n => {
    n.hit = false;
    n.missed = false;
  });

  // Schedule all MIDI notes to play as background track
  allMidiNotes.forEach(note => {
    Tone.Transport.schedule((time) => {
      if (isPlaying) {
        piano.triggerAttackRelease(note.name, note.duration, time, note.velocity);
      }
    }, note.time);
  });

  // Schedule song completion
  Tone.Transport.schedule(() => {
    if (isPlaying) {
      stopGame();
      document.getElementById("gameStatus").textContent = `Song Complete! Score: ${score}`;
    }
  }, currentSong.duration);

  Tone.Transport.start();

  document.getElementById("startBtn").disabled = true;
  document.getElementById("stopBtn").disabled = false;

  // Start animation loop
  gameLoop();
}

function stopGame() {
  Tone.Transport.stop();
  Tone.Transport.cancel();
  isPlaying = false;

  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  document.getElementById("startBtn").disabled = false;
  document.getElementById("stopBtn").disabled = true;
  drawIdle();
}

/* =========================
   GAME LOOP
========================= */
function gameLoop() {
  if (!isPlaying) return;

  currentTime = Tone.now() - gameStartTime;

  // Auto-miss notes that passed the judgment line
  gameNotes.forEach(note => {
    if (!note.hit && !note.missed) {
      const timeDiff = currentTime - note.time;
      if (timeDiff > CONFIG.HIT_WINDOW) {
        note.missed = true;
        combo = 0;
      }
    }
  });

  draw();
  animationId = requestAnimationFrame(gameLoop);
}

/* =========================
   INPUT
========================= */
function setupInput() {
  window.addEventListener("keydown", e => {
    const note = CONFIG.KEY_MAP[e.code];
    if (!note || !isPlaying) return;

    // Play feedback sound
    synth.triggerAttackRelease(note, "8n");

    // Find closest unhit note in this lane
    let closestNote = null;
    let closestDist = Infinity;

    gameNotes.forEach(n => {
      if (n.note === note && !n.hit && !n.missed) {
        const timeDiff = Math.abs(currentTime - n.time);
        if (timeDiff < closestDist && timeDiff < CONFIG.HIT_WINDOW) {
          closestNote = n;
          closestDist = timeDiff;
        }
      }
    });

    if (closestNote) {
      // Hit!
      closestNote.hit = true;
      score += 100;
      combo++;
      showJudgment("PERFECT");
    } else {
      // Wrong timing or wrong note
      combo = 0;
      showJudgment("MISS");
    }
  });
}

function showJudgment(text) {
  const status = document.getElementById("gameStatus");
  const oldText = status.textContent;
  status.textContent = text;
  status.style.color = text === "PERFECT" ? "var(--color-judgment)" : "var(--color-miss)";

  setTimeout(() => {
    if (isPlaying) {
      status.textContent = `Score: ${score} | Combo: ${combo}`;
      status.style.color = "var(--color-primary)";
    }
  }, 300);
}


/* =========================
   VISUALS
========================= */
const canvas = document.getElementById("pianoCanvas");
const ctx = canvas.getContext("2d");

function drawIdle() {
  ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
  ctx.fillStyle = "#123524";
  ctx.font = "28px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Press Start to Play", CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2);
  ctx.textAlign = "left";
}

function draw() {
  // Clear canvas
  ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

  drawLanes();
  drawJudgmentLine();
  drawNotes();
  drawKeyLabels();
}

function drawLanes() {
  const laneWidth = CONFIG.CANVAS_WIDTH / 7;

  for (let i = 0; i < 7; i++) {
    // Lane separator
    ctx.strokeStyle = "#a8d5ba";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(i * laneWidth, 0);
    ctx.lineTo(i * laneWidth, CONFIG.CANVAS_HEIGHT);
    ctx.stroke();

    // Lane background (subtle)
    if (i % 2 === 0) {
      ctx.fillStyle = "rgba(232, 243, 245, 0.1)";
      ctx.fillRect(i * laneWidth, 0, laneWidth, CONFIG.CANVAS_HEIGHT);
    }
  }
}

function drawJudgmentLine() {
  ctx.strokeStyle = "#00a767";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, CONFIG.JUDGMENT_LINE_Y);
  ctx.lineTo(CONFIG.CANVAS_WIDTH, CONFIG.JUDGMENT_LINE_Y);
  ctx.stroke();

  // Hit window indicator
  const windowSize = 20;
  ctx.fillStyle = "rgba(0, 167, 103, 0.2)";
  ctx.fillRect(0, CONFIG.JUDGMENT_LINE_Y - windowSize, CONFIG.CANVAS_WIDTH, windowSize * 2);
}

function drawNotes() {
  const laneWidth = CONFIG.CANVAS_WIDTH / 7;

  gameNotes.forEach(note => {
    if (note.hit || note.missed) return;

    // Calculate Y position based on time
    const timeUntilHit = note.time - currentTime;
    const fallProgress = 1 - (timeUntilHit / CONFIG.NOTE_FALL_TIME);

    if (fallProgress < 0 || fallProgress > 1.2) return; // Off screen

    const y = fallProgress * CONFIG.JUDGMENT_LINE_Y;
    const x = note.lane * laneWidth + laneWidth / 2;

    // Note circle
    ctx.fillStyle = "#52a876";
    ctx.strokeStyle = "#00a767";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.arc(x, y, CONFIG.NOTE_SIZE / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Key label on note
    ctx.fillStyle = "white";
    ctx.font = "bold 20px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(CONFIG.NOTE_TO_KEY[note.note], x, y);
  });

  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

function drawKeyLabels() {
  const laneWidth = CONFIG.CANVAS_WIDTH / 7;
  const keys = ['A', 'S', 'D', 'F', 'G', 'H', 'J'];

  ctx.font = "bold 18px sans-serif";
  ctx.textAlign = "center";

  for (let i = 0; i < 7; i++) {
    const x = i * laneWidth + laneWidth / 2;
    const y = CONFIG.CANVAS_HEIGHT - 30;

    // Key background
    ctx.fillStyle = "#123524";
    ctx.fillRect(x - 20, y - 15, 40, 30);

    // Key text
    ctx.fillStyle = "white";
    ctx.fillText(keys[i], x, y + 5);
  }

  ctx.textAlign = "left";
}
</script>

    <script>
        // Toggle settings dropdown
        function toggleSettings() {
            const menu = document.getElementById('settingsMenu');
            menu.classList.toggle('show');
        }

        // Close settings menu when clicking outside
        document.addEventListener('click', function(event) {
            const settingsDropdown = document.querySelector('.settings-dropdown');
            const menu = document.getElementById('settingsMenu');

            if (settingsDropdown && !settingsDropdown.contains(event.target)) {
                menu.classList.remove('show');
            }
        });

        // Save settings to localStorage
        function saveSettings() {
            const passwordGameDisabled = document.getElementById('disablePasswordGame').checked;
            const musicDisabled = document.getElementById('disableBackgroundMusic').checked;

            localStorage.setItem('invitation_disablePasswordGame', passwordGameDisabled);
            localStorage.setItem('invitation_disableBackgroundMusic', musicDisabled);

            console.log('Settings saved:', { passwordGameDisabled, musicDisabled });
        }

        // Load settings from localStorage
        function loadSettings() {
            const passwordGameDisabled = localStorage.getItem('invitation_disablePasswordGame') === 'true';
            const musicDisabled = localStorage.getItem('invitation_disableBackgroundMusic') === 'true';

            const passwordGameCheckbox = document.getElementById('disablePasswordGame');
            const musicCheckbox = document.getElementById('disableBackgroundMusic');

            if (passwordGameCheckbox) passwordGameCheckbox.checked = passwordGameDisabled;
            if (musicCheckbox) musicCheckbox.checked = musicDisabled;
        }

        // Load settings on page load
        window.addEventListener('DOMContentLoaded', loadSettings);
    </script>
