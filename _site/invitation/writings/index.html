<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Limelight&family=Jacquard+24&family=Quintessential&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Theme Colors */
            --color-primary: #123524;
            --color-secondary: #00a767;
            --color-accent: #eefdf4;
            --color-background: #e8f3f5;
            --color-white: #ffffff;
            --color-text-primary: #e8f3f5;
            --color-text-secondary: #eefdf4;
            --color-text-muted: #718096;
            --color-nav-bg: #123524;
            --color-hover-light: #c8e6d3;
            --color-hover-dark: #0a1f16;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: var(--color-nav-bg);
            min-height: 100vh;
            position: relative;
            padding-top: 90px;
            animation: backgroundCycle 30s ease-in-out infinite;
        }

        @keyframes backgroundCycle {
            0%, 100% {
                background: #F0FCF5;
            }
            33% {
                background: #E8F3F5;
            }
            66% {
                background: #9CB0A4;
            }
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--color-nav-bg);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            box-shadow: 0 2px 20px rgba(18, 53, 36, 0.3);
            z-index: 1000;
        }

        nav .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            color: #00a767;
            text-decoration: none;
            transition: all 0.3s;
        }

        nav .logo:hover {
            color: #eefdf4;
        }

        nav .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        nav .nav-links a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }

        nav .nav-links a:hover {
            color: var(--color-hover-dark);
            background: rgba(18, 53, 36, 0.1);
        }

        /* Full-Page Hero Banner */
        .invitation-banner {
            min-height: calc(100vh - 90px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 5%;
            position: relative;
        }

        .invitation-banner h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .invitation-banner p {
            font-size: 2rem;
            color: var(--color-primary);
            font-weight: 400;
        }

        /* Scroll Down Button */
        .scroll-down-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--color-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            animation: bounce 2s infinite;
        }

        .scroll-down-btn .material-symbols-outlined {
            font-size: 3rem;
        }

        .scroll-down-btn:hover {
            transform: translateX(-50%) translateY(5px);
            color: var(--color-secondary);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(-10px);
            }
            60% {
                transform: translateX(-50%) translateY(-5px);
            }
        }

        /* Content Area */
        .invitation-main {
            min-height: calc(100vh - 300px);
            padding: 20px 5%;
        }

        /* Decorative Elements */
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            top: 10%;
            left: 10%;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--color-text-secondary) 0%, transparent 70%);
            animation-delay: 0s;
        }

        .shape-2 {
            top: 60%;
            right: 15%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, var(--color-secondary) 0%, transparent 70%);
            animation-delay: 5s;
        }

        .shape-3 {
            bottom: 20%;
            left: 20%;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, var(--color-secondary) 0%, transparent 70%);
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(20px, -20px) rotate(90deg);
            }
            50% {
                transform: translate(-15px, 15px) rotate(180deg);
            }
            75% {
                transform: translate(15px, 20px) rotate(270deg);
            }
        }

        /* Settings Dropdown */
        .settings-dropdown {
            position: relative;
        }

        .settings-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            padding: 0.5rem;
            transition: transform 0.3s;
            color: var(--color-text-primary);
        }

        .settings-btn:hover {
            transform: rotate(45deg);
        }

        .settings-icon {
            display: block;
        }

        .settings-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 0.5rem;
            background: var(--color-white);
            border-radius: 12px;
            padding: 1rem;
            min-width: 250px;
            box-shadow: 0 8px 24px rgba(18, 53, 36, 0.25);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s;
            z-index: 1001;
        }

        .settings-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .settings-item {
            padding: 0.75rem 0;
        }

        .settings-item label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            color: var(--color-primary);
            font-weight: 500;
        }

        .settings-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--color-primary);
        }

        .settings-item span {
            user-select: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            nav .nav-links {
                gap: 1rem;
                font-size: 0.9rem;
            }

            .invitation-banner h1 {
                font-size: 3.5rem;
            }

            .invitation-banner p {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            nav {
                padding: 0.8rem 5%;
            }

            nav .logo {
                font-size: 1.3rem;
            }

            nav .nav-links {
                gap: 0.5rem;
                font-size: 0.85rem;
            }

            nav .nav-links a {
                padding: 0.4rem 0.6rem;
            }

            .invitation-banner h1 {
                font-size: 2.5rem;
            }

            .invitation-banner p {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <nav>

                </div>
            </div>
        </div>
    </nav>

<style>
    :root {
        /* Theme Colors */
        --color-primary: #123524;
        --color-secondary: #00a767;
        --color-accent: #eefdf4;
        --color-background: #e8f3f5;
        --color-white: #ffffff;
        --color-text-primary: #123524;
        --color-text-secondary: #4a5568;
        --color-text-muted: #718096;
        --color-border-accent: #a8d5ba;
    }

    .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }

    .section-view {
        padding: 20px;
        max-width: 900px;
        margin: 0 auto;
    }

    .section-view h1 {
        font-size: 2.5rem;
        color: var(--color-primary);
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .section-view h1 .material-symbols-outlined {
        font-size: 2.5rem;
    }

    .section-description {
        text-align: center;
        color: var(--color-text-secondary);
        margin-bottom: 2rem;
        font-size: 1.1rem;
    }

    /* Writing Cards Grid */
    .writings-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 24px;
        margin-top: 2rem;
    }

    .writing-card {
        background: linear-gradient(135deg, #f5fdf8 0%, #edf9f1 100%);
        border: 2px solid var(--color-border-accent);
        border-radius: 16px;
        padding: 24px;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 12px rgba(18, 53, 36, 0.1);
        position: relative;
        overflow: hidden;
    }

    .writing-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 24px rgba(18, 53, 36, 0.2);
        border-color: var(--color-secondary);
    }

    .writing-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: var(--color-secondary);
        transform: scaleY(0);
        transition: transform 0.3s;
    }

    .writing-card:hover::before {
        transform: scaleY(1);
    }

    .writing-card h3 {
        color: var(--color-primary);
        font-size: 1.5rem;
        margin-bottom: 0.75rem;
        font-family: 'Playfair Display', serif;
    }

    .writing-card .date {
        color: var(--color-text-muted);
        font-size: 0.85rem;
        margin-bottom: 1rem;
        font-style: italic;
    }

    .writing-card .preview {
        color: var(--color-text-secondary);
        line-height: 1.6;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    .writing-card .read-more {
        color: var(--color-secondary);
        font-weight: 600;
        margin-top: 1rem;
        display: inline-block;
    }

    /* Empty State */
    .empty-writings {
        text-align: center;
        padding: 60px 20px;
        background: linear-gradient(135deg, #f5fdf8 0%, #edf9f1 100%);
        border-radius: 16px;
        border: 2px dashed var(--color-border-accent);
    }

    .empty-writings p {
        color: var(--color-text-secondary);
        font-size: 1rem;
    }

    /* Modal Styles */
    .writing-modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 2000;
        animation: fadeIn 0.3s;
        overflow-y: auto;
    }

    .writing-modal.active {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .modal-content {
        background: white;
        border-radius: 20px;
        max-width: 800px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        padding: 40px;
        position: relative;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        animation: slideUp 0.3s;
    }

    @keyframes slideUp {
        from {
            transform: translateY(30px);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    .modal-close {
        position: absolute;
        top: 20px;
        right: 20px;
        font-size: 2rem;
        color: var(--color-text-muted);
        cursor: pointer;
        background: transparent;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
    }

    .modal-close:hover {
        background: rgba(18, 53, 36, 0.1);
        color: var(--color-primary);
    }

    .modal-content h2 {
        color: var(--color-primary);
        font-size: 2rem;
        margin-bottom: 0.5rem;
        font-family: 'Playfair Display', serif;
    }

    .modal-content .modal-date {
        color: var(--color-text-muted);
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
        font-style: italic;
    }

    .modal-content .modal-body {
        color: var(--color-text-secondary);
        line-height: 1.8;
        font-size: 1.05rem;
    }

    .modal-content .modal-body p {
        margin-bottom: 1rem;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .writings-grid {
            grid-template-columns: 1fr;
        }

        .modal-content {
            padding: 30px 20px;
        }

        .modal-content h2 {
            font-size: 1.5rem;
        }
    }

</style>

<div class="section-view">

<script>

    // Sample writings data - Replace this with your actual writings
    const writings = [

            content: `An ode to you

    function loadWritings() {
        const grid = document.getElementById('writingsGrid');

        if (writings.length === 0) {
            return; // Show empty state
        }

        // Clear empty state
        grid.innerHTML = '';

        writings.forEach(writing => {
            const card = document.createElement('div');
            card.className = 'writing-card';
            card.onclick = () => openWriting(writing.id);

            card.innerHTML = `
                <h3>${writing.title}</h3>
                <div class="date">${writing.date}</div>
                <div class="preview">${writing.preview}</div>
                <span class="read-more">Read more →</span>
            `;

            grid.appendChild(card);
        });
    }

    function openWriting(id) {
        const writing = writings.find(w => w.id === id);
        if (!writing) return;

        const modal = document.getElementById('writingModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalDate = document.getElementById('modalDate');
        const modalBody = document.getElementById('modalBody');

        modalTitle.textContent = writing.title;
        modalDate.textContent = writing.date;

        // Convert content to HTML - preserve line breaks without excessive spacing
        // Replace newlines with <br> tags for poems
        const formattedContent = writing.content
            .split('\n')
            .map(line => line.trim())
            .filter(line => line !== '')
            .join('<br>');

        modalBody.innerHTML = `<p style="white-space: pre-line; line-height: 1.8;">${formattedContent}</p>`;

        modal.classList.add('active');

        // Close modal when clicking outside
        modal.onclick = closeModal;

        // Add keyboard support
        document.addEventListener('keydown', handleModalKeyboard);
    }

    function closeModal() {
        const modal = document.getElementById('writingModal');
        modal.classList.remove('active');
        modal.onclick = null;
        document.removeEventListener('keydown', handleModalKeyboard);
    }

    function handleModalKeyboard(event) {
        if (event.key === 'Escape') {
            event.preventDefault();
            closeModal();
        }
    }
</script>


    </main>

    <script>
        // Toggle settings dropdown
        function toggleSettings() {
            const menu = document.getElementById('settingsMenu');
            menu.classList.toggle('show');
        }

        // Close settings menu when clicking outside
        document.addEventListener('click', function(event) {
            const settingsDropdown = document.querySelector('.settings-dropdown');
            const menu = document.getElementById('settingsMenu');

            if (settingsDropdown && !settingsDropdown.contains(event.target)) {
                menu.classList.remove('show');
            }
        });

        // Save settings to localStorage
        function saveSettings() {
            const passwordGameDisabled = document.getElementById('disablePasswordGame').checked;
            const musicDisabled = document.getElementById('disableBackgroundMusic').checked;

            localStorage.setItem('invitation_disablePasswordGame', passwordGameDisabled);
            localStorage.setItem('invitation_disableBackgroundMusic', musicDisabled);

            console.log('Settings saved:', { passwordGameDisabled, musicDisabled });
        }

        // Load settings from localStorage
        function loadSettings() {
            const passwordGameDisabled = localStorage.getItem('invitation_disablePasswordGame') === 'true';
            const musicDisabled = localStorage.getItem('invitation_disableBackgroundMusic') === 'true';

            const passwordGameCheckbox = document.getElementById('disablePasswordGame');
            const musicCheckbox = document.getElementById('disableBackgroundMusic');

            if (passwordGameCheckbox) passwordGameCheckbox.checked = passwordGameDisabled;
            if (musicCheckbox) musicCheckbox.checked = musicDisabled;
        }

        // Load settings on page load
        window.addEventListener('DOMContentLoaded', loadSettings);
    </script>
