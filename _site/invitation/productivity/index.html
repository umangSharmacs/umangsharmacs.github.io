<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Limelight&family=Jacquard+24&family=Quintessential&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Theme Colors */
            --color-primary: #123524;
            --color-secondary: #00a767;
            --color-accent: #eefdf4;
            --color-background: #e8f3f5;
            --color-white: #ffffff;
            --color-text-primary: #e8f3f5;
            --color-text-secondary: #eefdf4;
            --color-text-muted: #718096;
            --color-nav-bg: #123524;
            --color-hover-light: #c8e6d3;
            --color-hover-dark: #0a1f16;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: var(--color-nav-bg);
            min-height: 100vh;
            position: relative;
            padding-top: 90px;
            animation: backgroundCycle 30s ease-in-out infinite;
        }

        @keyframes backgroundCycle {
            0%, 100% {
                background: #F0FCF5;
            }
            33% {
                background: #E8F3F5;
            }
            66% {
                background: #9CB0A4;
            }
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--color-nav-bg);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            box-shadow: 0 2px 20px rgba(18, 53, 36, 0.3);
            z-index: 1000;
        }

        nav .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            color: #00a767;
            text-decoration: none;
            transition: all 0.3s;
        }

        nav .logo:hover {
            color: #eefdf4;
        }

        nav .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        nav .nav-links a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }

        nav .nav-links a:hover {
            color: var(--color-hover-dark);
            background: rgba(18, 53, 36, 0.1);
        }

        /* Full-Page Hero Banner */
        .invitation-banner {
            min-height: calc(100vh - 90px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 5%;
            position: relative;
        }

        .invitation-banner h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .invitation-banner p {
            font-size: 2rem;
            color: var(--color-primary);
            font-weight: 400;
        }

        /* Scroll Down Button */
        .scroll-down-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--color-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            animation: bounce 2s infinite;
        }

        .scroll-down-btn .material-symbols-outlined {
            font-size: 3rem;
        }

        .scroll-down-btn:hover {
            transform: translateX(-50%) translateY(5px);
            color: var(--color-secondary);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(-10px);
            }
            60% {
                transform: translateX(-50%) translateY(-5px);
            }
        }

        /* Content Area */
        .invitation-main {
            min-height: calc(100vh - 300px);
            padding: 20px 5%;
        }

        /* Decorative Elements */
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            top: 10%;
            left: 10%;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--color-text-secondary) 0%, transparent 70%);
            animation-delay: 0s;
        }

        .shape-2 {
            top: 60%;
            right: 15%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, var(--color-secondary) 0%, transparent 70%);
            animation-delay: 5s;
        }

        .shape-3 {
            bottom: 20%;
            left: 20%;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, var(--color-secondary) 0%, transparent 70%);
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(20px, -20px) rotate(90deg);
            }
            50% {
                transform: translate(-15px, 15px) rotate(180deg);
            }
            75% {
                transform: translate(15px, 20px) rotate(270deg);
            }
        }

        /* Settings Dropdown */
        .settings-dropdown {
            position: relative;
        }

        .settings-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            padding: 0.5rem;
            transition: transform 0.3s;
            color: var(--color-text-primary);
        }

        .settings-btn:hover {
            transform: rotate(45deg);
        }

        .settings-icon {
            display: block;
        }

        .settings-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 0.5rem;
            background: var(--color-white);
            border-radius: 12px;
            padding: 1rem;
            min-width: 250px;
            box-shadow: 0 8px 24px rgba(18, 53, 36, 0.25);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s;
            z-index: 1001;
        }

        .settings-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .settings-item {
            padding: 0.75rem 0;
        }

        .settings-item label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            color: var(--color-primary);
            font-weight: 500;
        }

        .settings-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--color-primary);
        }

        .settings-item span {
            user-select: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            nav .nav-links {
                gap: 1rem;
                font-size: 0.9rem;
            }

            .invitation-banner h1 {
                font-size: 3.5rem;
            }

            .invitation-banner p {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            nav {
                padding: 0.8rem 5%;
            }

            nav .logo {
                font-size: 1.3rem;
            }

            nav .nav-links {
                gap: 0.5rem;
                font-size: 0.85rem;
            }

            nav .nav-links a {
                padding: 0.4rem 0.6rem;
            }

            .invitation-banner h1 {
                font-size: 2.5rem;
            }

            .invitation-banner p {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Decorative Shapes -->
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Pastel Navigation -->
    <nav>
        <div class="nav-container">
            <a href="/invitation/" class="logo"> Hub</a>
            <div class="settings-dropdown">
                <button class="settings-btn" onclick="toggleSettings()">
                    <span class="material-symbols-outlined settings-icon">settings</span>
                </button>
                <div class="settings-menu" id="settingsMenu">
                    <div class="settings-item">
                        <label>
                            <input type="checkbox" id="disablePasswordGame" onchange="saveSettings()">
                            <span>Disable Password Game</span>
                        </label>
                    </div>
                    <div class="settings-item">
                        <label>
                            <input type="checkbox" id="disableBackgroundMusic" onchange="saveSettings()">
                            <span>Disable Background Music</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="invitation-main" id="main-content">
        <style>
    :root {
        /* Theme Colors */
        --color-primary: #123524;
        --color-secondary: #00a767;
        --color-accent: #eefdf4;
        --color-background: #e8f3f5;
        --color-white: #ffffff;
        --color-text-primary: #e8f3f5;
        --color-text-secondary: #eefdf4;
        --color-text-muted: #718096;
        --color-border-accent: #a8d5ba;

    /* Hide layout navigation and banner for fullscreen experience */
    nav,
    .invitation-banner,
    .floating-shapes {
        display: none !important;
    }

    body {
        margin: 0;
        padding: 0;
        overflow: hidden;

    main.invitation-main {
        padding: 0 !important;
        margin: 0 !important;
        min-height: 0 !important;
    }

    .section-view {

        margin: 0;

        height: 100vh;
        overflow: hidden;
        display: flex;

    }

    .section-view h1 {
        display: none;
    }

    /* Plant Game Styles */
    .plant-game {
        background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        border-radius: 0;
        padding: 0;
        margin: 0;
        border: none;
        display: grid;
        grid-template-columns: 280px 1fr 50px;
        grid-template-rows: 1fr 80px;
        gap: 0;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
    }

    .plant-game h2 {
        display: none;
    }

    .timer-section {
        display: none;
    }

    .timer-display {
        display: none;
    }

    .timer-controls {
        grid-column: 2;
        grid-row: 2;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px;
        gap: 15px;
        min-height: 60px;
        max-height: 80px;
    }

    .timer-btn {
        background: linear-gradient(135deg, #52a876 0%, var(--color-text-secondary) 100%);
        color: white;
        border: none;
        padding: 15px 40px;
        border-radius: 16px;
        font-size: 1.2rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 12px rgba(82, 168, 118, 0.3);
    }

    .timer-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(82, 168, 118, 0.4);
    }

    .timer-btn:active {
        transform: translateY(0);
    }

    .timer-btn.stop {
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    }

    .timer-btn.pause {
        background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
    }

    .timer-status {
        display: none;
    }

    .resources-bar {
        display: none;
    }

    .resource-item {
        display: none;
    }

    .resource-icon {
        display: none;
    }

    .resource-label {
        display: none;
    }

    .resource-value {
        display: none;
    }

    .garden-container {
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 20px;
        position: relative;
        overflow: hidden;
        grid-column: 2;
        grid-row: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
    }

    .garden-container::before {
        display: none;
    }

    .garden-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 0;
        position: relative;
        z-index: 1;
        width: min(calc(100vw - 400px), calc(100vh - 180px));
        height: min(calc(100vw - 400px), calc(100vh - 180px));
        max-width: 700px;
        max-height: 700px;
        aspect-ratio: 1 / 1;
    }

    .plant-pot {
        background: linear-gradient(135deg, #d4a574 0%, #b8956a 100%);
        border: 2px solid #8b7355;
        border-radius: 0;
        padding: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
        box-shadow: none;
        overflow: visible;
        width: 100%;
        height: 100%;
        aspect-ratio: 1 / 1;
    }

    .plant-pot:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(139, 115, 85, 0.4);
    }

    .plant-pot.empty {
        background: linear-gradient(135deg, #e7e5e4 0%, #d6d3d1 100%);
        border-color: #a8a29e;
    }

    .plant-visual {
        position: absolute;
        bottom: 15%;
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        height: 60%;
        transition: all 0.5s ease;
    }

    .plant-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        animation: gentleSway 3s ease-in-out infinite;
        transform-origin: bottom center;
    }

    @keyframes gentleSway {
        0%, 100% {
            transform: rotate(0deg);
        }
        25% {
            transform: rotate(-1deg);
        }
        75% {
            transform: rotate(1deg);
        }
    }

    .plant-pot:hover .plant-svg {
        animation: growPulse 0.5s ease-in-out;
    }

    @keyframes growPulse {
        0%, 100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.05);
        }
    }

    .empty-pot-icon {
        font-size: clamp(1.5rem, 3vw, 2.5rem);
        opacity: 0.5;
    }

    .plant-info {
        text-align: center;
        font-size: clamp(0.6rem, 1vw, 0.8rem);
        color: #44403c;
        font-weight: 600;
        position: relative;
        z-index: 10;
        background: rgba(255, 255, 255, 0.8);
        padding: 2px 5px;
        border-radius: 4px;
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
    }

    .growth-bar {
        width: 100%;
        height: 3px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 0.2rem;
        position: relative;
        z-index: 10;
    }

    .growth-progress {
        height: 100%;
        background: linear-gradient(90deg, #86efac 0%, #22c55e 100%);
        border-radius: 2px;
        transition: width 0.5s;
    }

    .seed-selector {
        background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%);
        border-right: 3px solid #c084fc;
        border-radius: 0;
        padding: 20px 15px;
        grid-column: 1;
        grid-row: 1 / 3;
        overflow-y: auto;
    }

    .seed-selector h3 {
        color: #6b21a8;
        margin-bottom: 1.5rem;
        text-align: center;
        font-size: 1.5rem;
    }

    .seed-grid {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    .seed-card {
        background: white;
        border: 2px solid #d8b4fe;
        border-radius: 12px;
        padding: 15px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
    }

    .seed-card:hover {
        transform: scale(1.05);
        border-color: #a855f7;
        box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
    }

    .seed-card.selected {
        border-color: #7c3aed;
        background: linear-gradient(135deg, #f3e8ff 0%, #e9d5ff 100%);
        box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
    }

    .seed-card.locked {
        opacity: 0.5;
        cursor: not-allowed;
        filter: grayscale(100%);
    }

    .seed-icon {
        font-size: 2.5rem;
        display: block;
        margin-bottom: 0.5rem;
    }

    .seed-name {
        font-size: 0.85rem;
        font-weight: 600;
        color: #6b21a8;
    }

    .notification-popup {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.9);
        background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
        border: 3px solid #f59e0b;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        z-index: 2000;
        text-align: center;
        max-width: 400px;
        opacity: 0;
        pointer-events: none;
        transition: all 0.3s;
    }

    .notification-popup.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        pointer-events: all;
    }

    .notification-popup h3 {
        font-size: 1.8rem;
        color: #92400e;
        margin-bottom: 1rem;
    }

    .notification-popup p {
        font-size: 1.1rem;
        color: #78350f;
        margin-bottom: 1.5rem;
    }

    .notification-btn {
        background: linear-gradient(135deg, #52a876 0%, var(--color-text-secondary) 100%);
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
    }

    .notification-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(82, 168, 118, 0.4);
    }

    .stats-display {
        display: none;
    }

    .stat-item {
        display: none;
    }

    .stat-item .label {
        display: none;
    }

    .stat-item .value {
        display: none;
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
        .plant-game {
            grid-template-columns: 1fr;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
        }

        .seed-selector {
            grid-column: 1;
            grid-row: 1;
            border-right: none;
            border-bottom: 3px solid #c084fc;
            max-height: 150px;
            overflow-y: auto;
        }

        .seed-grid {
            flex-direction: row;
            overflow-x: auto;
        }

        .garden-container {
            grid-column: 1;
            grid-row: 2;
        }

        .timer-controls {
            grid-column: 1;
            grid-row: 3;
        }
    }
</style>

<script>
    // Check authentication
    window.addEventListener('DOMContentLoaded', function() {
        if (sessionStorage.getItem('invitation_authenticated') !== 'true') {
            window.location.href = '/invitation/';
        }

        // Hide banner on section pages
        const banner = document.querySelector('.invitation-banner');
        if (banner) {
            banner.style.display = 'none';
        }
    });

    const POT_COUNT = 16; // 4x4 grid
    const GROWTH_STAGES = 5;
    const GROWTH_PER_SECOND = 100 / (WORK_SESSION_DURATION * 3); // 3 sessions to grow

    // Plant types with unlock requirements and visual properties

        },
        {
            id: 'cactus',
            name: 'Cactus',
            icon: '🌵',
            unlockAt: 50,
            colors: { stem: '#2e7d32', leaf: '#388e3c', petal: '#ff4081', center: '#fff59d' }
        }
    ];

    // ===== STATE =====
    let plantGameState = {
        timer: {
            remaining: WORK_SESSION_DURATION,
            isRunning: false,
            isPaused: false,
            startTime: null,
            pausedTime: 0
        },
        intervals: {
            lastWater: Date.now(),
            lastFertilize: Date.now(),
            lastFertilizerRefresh: Date.now()
        },
        resources: {
            fertilizer: 5,
            seeds: {}
        },
        garden: Array(POT_COUNT).fill(null),
        selectedSeed: 'sunflower',
        stats: {
            sessionsCompleted: 0,
            totalWorkTime: 0, // in seconds
            plantsHarvested: 0
        }
    };

    // Initialize seed counts
    SEED_TYPES.forEach(seed => {
        plantGameState.resources.seeds[seed.id] = seed.id === 'sunflower' ? 3 : 0;
    });

    // ===== INITIALIZATION =====
    function initPlantGame() {
        loadGameState();
        checkDailyReset();
        renderGarden();
        renderSeedSelector();
        updateResourceDisplay();
        updateStatsDisplay();
        requestNotificationPermission();

        // Check for pending notifications
        checkPendingNotifications();

        // Start background timer for notifications
        setInterval(checkPendingNotifications, 60000); // Check every minute
    }

    // ===== TIMER FUNCTIONS =====
    let timerInterval = null;

    function startWork() {
        plantGameState.timer.isRunning = true;
        plantGameState.timer.isPaused = false;
        plantGameState.timer.startTime = Date.now();

        const startBtn = document.getElementById('startBtn');
        startBtn.style.display = 'none';
        document.getElementById('pauseBtn').style.display = 'inline-block';
        document.getElementById('stopBtn').style.display = 'inline-block';

        timerInterval = setInterval(updateTimer, 1000);
        saveGameState();
    }

    function pauseWork() {
        if (plantGameState.timer.isPaused) {
            // Resume
            plantGameState.timer.isPaused = false;
            plantGameState.timer.startTime = Date.now();
            document.getElementById('pauseBtn').textContent = 'Pause';
        } else {
            // Pause
            plantGameState.timer.isPaused = true;
            plantGameState.timer.pausedTime = Date.now();
            document.getElementById('pauseBtn').textContent = 'Resume';
        }
    }

    function stopWork() {
        plantGameState.timer.isRunning = false;
        plantGameState.timer.isPaused = false;
        plantGameState.timer.remaining = WORK_SESSION_DURATION;

        clearInterval(timerInterval);

        document.getElementById('startBtn').style.display = 'inline-block';
        document.getElementById('pauseBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'none';

        saveGameState();
    }

    function updateTimer() {
        if (plantGameState.timer.isPaused) return;

        plantGameState.timer.remaining--;
        plantGameState.stats.totalWorkTime++;

        // Grow plants
        growPlants();

        // Check if session complete
        if (plantGameState.timer.remaining <= 0) {
            completeWorkSession();
        }

        // Save state periodically
        if (plantGameState.timer.remaining % 10 === 0) {
            saveGameState();
        }
    }

    function completeWorkSession() {
        clearInterval(timerInterval);

        plantGameState.timer.remaining = WORK_SESSION_DURATION;
        plantGameState.timer.isRunning = false;
        plantGameState.stats.sessionsCompleted++;

        document.getElementById('startBtn').style.display = 'inline-block';
        document.getElementById('startBtn').textContent = 'Ready to Start';
        document.getElementById('pauseBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'none';

        // Check for newly unlocked seeds
        checkUnlockedSeeds();

        saveGameState();

        showNotification('✅ Session Complete!', 'Great work! Your plants have grown!');
    }

    // ===== PLANT GROWTH =====
    function growPlants() {
        let updated = false;

        plantGameState.garden.forEach((plant, index) => {
            if (plant && plant.growth < 100) {
                plant.growth = Math.min(100, plant.growth + GROWTH_PER_SECOND);
                plant.lastWatered = plant.lastWatered || Date.now();
                updated = true;

                // Check if plant reached full growth
                if (plant.growth >= 100 && !plant.isFullyGrown) {
                    plant.isFullyGrown = true;
                    showNotification('🌺 Plant Fully Grown!', `Your ${SEED_TYPES.find(s => s.id === plant.type).name} is ready to harvest!`);
                }
            }
        });

        if (updated) {
            renderGarden();
        }
    }

    // ===== GARDEN MANAGEMENT =====
    function renderGarden() {
        const grid = document.getElementById('gardenGrid');
        grid.innerHTML = '';

        plantGameState.garden.forEach((plant, index) => {
            const pot = document.createElement('div');
            pot.className = plant ? 'plant-pot' : 'plant-pot empty';

            if (plant) {
                const seedType = SEED_TYPES.find(s => s.id === plant.type);
                const growthPercent = plant.growth;

                // Create plant visual container
                const visualContainer = document.createElement('div');
                visualContainer.className = 'plant-visual';
                visualContainer.innerHTML = generatePlantSVG(seedType, growthPercent);

                pot.appendChild(visualContainer);

                const info = document.createElement('div');
                info.className = 'plant-info';
                info.textContent = seedType.name;
                pot.appendChild(info);

                const growthBar = document.createElement('div');
                growthBar.className = 'growth-bar';
                growthBar.innerHTML = `<div class="growth-progress" style="width: ${growthPercent}%"></div>`;
                pot.appendChild(growthBar);

                pot.onclick = () => interactWithPlant(index);
            } else {
                pot.innerHTML = `
                    <div class="empty-pot-icon">🪴</div>
                    <div class="plant-info">Empty Pot</div>
                `;
                pot.onclick = () => plantSeed(index);
            }

            grid.appendChild(pot);
        });
    }

    // ===== PROCEDURAL PLANT SVG GENERATION =====
    function generatePlantSVG(seedType, growthPercent) {
        const colors = seedType.colors;
        const growth = growthPercent / 100; // Normalize to 0-1

        // Base dimensions (scaled for smaller pots)
        const svgWidth = 80;
        const svgHeight = 100;
        const centerX = svgWidth / 2;

        let svg = `<svg class="plant-svg" viewBox="0 0 ${svgWidth} ${svgHeight}" xmlns="http://www.w3.org/2000/svg">`;

        // Different plant types have different generation logic
        switch(seedType.id) {
            case 'sunflower':
                svg += generateSunflower(centerX, svgHeight, growth, colors);
                break;
            case 'rose':
                svg += generateRose(centerX, svgHeight, growth, colors);
                break;
            case 'tulip':
                svg += generateTulip(centerX, svgHeight, growth, colors);
                break;
            case 'daisy':
                svg += generateDaisy(centerX, svgHeight, growth, colors);
                break;
            case 'hibiscus':
                svg += generateHibiscus(centerX, svgHeight, growth, colors);
                break;
            case 'lotus':
                svg += generateLotus(centerX, svgHeight, growth, colors);
                break;
            case 'cherry':
                svg += generateCherryBlossom(centerX, svgHeight, growth, colors);
                break;
            case 'cactus':
                svg += generateCactus(centerX, svgHeight, growth, colors);
                break;
            default:
                svg += generateGenericPlant(centerX, svgHeight, growth, colors);
        }

        svg += '</svg>';
        return svg;
    }

    // ===== PLANT GENERATORS =====
    function generateSunflower(x, baseY, growth, colors) {
        let svg = '';
        const stemHeight = 60 * growth;
        const stemY = baseY - 10;

        // Stem
        if (growth > 0.1) {
            svg += `<line x1="${x}" y1="${stemY}" x2="${x}" y2="${stemY - stemHeight}"
                stroke="${colors.stem}" stroke-width="2.5" stroke-linecap="round"/>`;
        }

        // Leaves
        if (growth > 0.3) {
            const leafSize = 10 * Math.min(1, (growth - 0.3) / 0.3);
            svg += `<ellipse cx="${x - 6}" cy="${stemY - stemHeight * 0.4}" rx="${leafSize}" ry="${leafSize * 0.6}"
                fill="${colors.leaf}" transform="rotate(-45 ${x - 6} ${stemY - stemHeight * 0.4})"/>`;
            svg += `<ellipse cx="${x + 6}" cy="${stemY - stemHeight * 0.6}" rx="${leafSize}" ry="${leafSize * 0.6}"
                fill="${colors.leaf}" transform="rotate(45 ${x + 6} ${stemY - stemHeight * 0.6})"/>`;
        }

        // Flower
        if (growth > 0.6) {
            const flowerSize = 16 * Math.min(1, (growth - 0.6) / 0.4);
            const flowerY = stemY - stemHeight;

            // Petals
            for (let i = 0; i < 12; i++) {
                const angle = (i * 30) * Math.PI / 180;
                const petalX = x + Math.cos(angle) * flowerSize * 0.6;
                const petalY = flowerY + Math.sin(angle) * flowerSize * 0.6;
                svg += `<ellipse cx="${petalX}" cy="${petalY}" rx="${flowerSize * 0.4}" ry="${flowerSize * 0.25}"
                    fill="${colors.petal}" transform="rotate(${i * 30} ${petalX} ${petalY})"/>`;
            }

            // Center
            svg += `<circle cx="${x}" cy="${flowerY}" r="${flowerSize * 0.4}" fill="${colors.center}"/>`;
        }

        return svg;
    }

    function generateRose(x, baseY, growth, colors) {
        let svg = '';
        const stemHeight = 65 * growth;
        const stemY = baseY - 10;

        // Thorny stem
        if (growth > 0.1) {
            svg += `<path d="M ${x} ${stemY} Q ${x - 2} ${stemY - stemHeight * 0.3} ${x} ${stemY - stemHeight * 0.5}
                T ${x} ${stemY - stemHeight}" stroke="${colors.stem}" stroke-width="2" fill="none"/>`;

            // Thorns
            if (growth > 0.3) {
                const thornCount = Math.floor(growth * 3);
                for (let i = 0; i < thornCount; i++) {
                    const ty = stemY - stemHeight * (0.2 + i * 0.25);
                    const side = i % 2 === 0 ? 1 : -1;
                    svg += `<path d="M ${x} ${ty} l ${side * 2.5} ${-3}" stroke="${colors.stem}" stroke-width="1.2"/>`;
                }
            }
        }

        // Leaves
        if (growth > 0.35) {
            const leafSize = 8 * Math.min(1, (growth - 0.35) / 0.3);
            svg += `<path d="M ${x - 5} ${stemY - stemHeight * 0.5} q ${-leafSize} ${-leafSize * 0.5} ${-leafSize} ${leafSize * 0.5}"
                fill="${colors.leaf}" stroke="${colors.stem}" stroke-width="0.8"/>`;
            svg += `<path d="M ${x + 5} ${stemY - stemHeight * 0.4} q ${leafSize} ${-leafSize * 0.5} ${leafSize} ${leafSize * 0.5}"
                fill="${colors.leaf}" stroke="${colors.stem}" stroke-width="0.8"/>`;
        }

        // Rose bloom
        if (growth > 0.65) {
            const bloomSize = 12 * Math.min(1, (growth - 0.65) / 0.35);
            const bloomY = stemY - stemHeight;

            // Outer petals
            for (let i = 0; i < 8; i++) {
                const angle = (i * 45) * Math.PI / 180;
                const petalX = x + Math.cos(angle) * bloomSize * 0.5;
                const petalY = bloomY + Math.sin(angle) * bloomSize * 0.5;
                svg += `<ellipse cx="${petalX}" cy="${petalY}" rx="${bloomSize * 0.35}" ry="${bloomSize * 0.25}"
                    fill="${colors.petal}" opacity="0.9" transform="rotate(${i * 45} ${petalX} ${petalY})"/>`;
            }

            // Inner petals
            for (let i = 0; i < 6; i++) {
                const angle = (i * 60 + 30) * Math.PI / 180;
                const petalX = x + Math.cos(angle) * bloomSize * 0.25;
                const petalY = bloomY + Math.sin(angle) * bloomSize * 0.25;
                svg += `<ellipse cx="${petalX}" cy="${petalY}" rx="${bloomSize * 0.25}" ry="${bloomSize * 0.15}"
                    fill="${colors.petal}" opacity="0.95" transform="rotate(${i * 60} ${petalX} ${petalY})"/>`;
            }

            // Center
            svg += `<circle cx="${x}" cy="${bloomY}" r="${bloomSize * 0.12}" fill="${colors.center}"/>`;
        }

        return svg;
    }

    function generateTulip(x, baseY, growth, colors) {
        let svg = '';
        const stemHeight = 60 * growth;
        const stemY = baseY - 10;

        // Stem
        if (growth > 0.1) {
            svg += `<line x1="${x}" y1="${stemY}" x2="${x}" y2="${stemY - stemHeight}"
                stroke="${colors.stem}" stroke-width="2" stroke-linecap="round"/>`;
        }

        // Leaves
        if (growth > 0.3) {
            const leafSize = 16 * Math.min(1, (growth - 0.3) / 0.3);
            svg += `<path d="M ${x - 4} ${stemY - stemHeight * 0.3} q ${-leafSize * 0.7} ${leafSize * 0.4} ${-leafSize * 0.4} ${leafSize}"
                fill="${colors.leaf}" stroke="${colors.stem}" stroke-width="0.8"/>`;
            svg += `<path d="M ${x + 4} ${stemY - stemHeight * 0.5} q ${leafSize * 0.7} ${leafSize * 0.4} ${leafSize * 0.4} ${leafSize}"
                fill="${colors.leaf}" stroke="${colors.stem}" stroke-width="0.8"/>`;
        }

        // Tulip flower
        if (growth > 0.6) {
            const flowerSize = 14 * Math.min(1, (growth - 0.6) / 0.4);
            const flowerY = stemY - stemHeight;

            // Three front petals
            svg += `<ellipse cx="${x}" cy="${flowerY}" rx="${flowerSize * 0.3}" ry="${flowerSize * 0.6}"
                fill="${colors.petal}" stroke="${colors.petal}" stroke-width="0.8"/>`;
            svg += `<ellipse cx="${x - flowerSize * 0.35}" cy="${flowerY}" rx="${flowerSize * 0.3}" ry="${flowerSize * 0.6}"
                fill="${colors.petal}" opacity="0.9" stroke="${colors.petal}" stroke-width="0.8"/>`;
            svg += `<ellipse cx="${x + flowerSize * 0.35}" cy="${flowerY}" rx="${flowerSize * 0.3}" ry="${flowerSize * 0.6}"
                fill="${colors.petal}" opacity="0.9" stroke="${colors.petal}" stroke-width="0.8"/>`;

            // Center stamens
            if (growth > 0.85) {
                svg += `<line x1="${x}" y1="${flowerY}" x2="${x}" y2="${flowerY - flowerSize * 0.35}"
                    stroke="${colors.center}" stroke-width="1.2"/>`;
                svg += `<circle cx="${x}" cy="${flowerY - flowerSize * 0.35}" r="1.5" fill="${colors.center}"/>`;
            }
        }

        return svg;
    }

    function generateDaisy(x, baseY, growth, colors) {
        let svg = '';
        const stemHeight = 55 * growth;
        const stemY = baseY - 10;

        // Thin stem
        if (growth > 0.1) {
            svg += `<line x1="${x}" y1="${stemY}" x2="${x}" y2="${stemY - stemHeight}"
                stroke="${colors.stem}" stroke-width="1.8" stroke-linecap="round"/>`;
        }

        // Small leaves
        if (growth > 0.35) {
            const leafSize = 6 * Math.min(1, (growth - 0.35) / 0.3);
            svg += `<ellipse cx="${x - 5}" cy="${stemY - stemHeight * 0.45}" rx="${leafSize}" ry="${leafSize * 0.5}"
                fill="${colors.leaf}" transform="rotate(-30 ${x - 5} ${stemY - stemHeight * 0.45})"/>`;
            svg += `<ellipse cx="${x + 5}" cy="${stemY - stemHeight * 0.55}" rx="${leafSize}" ry="${leafSize * 0.5}"
                fill="${colors.leaf}" transform="rotate(30 ${x + 5} ${stemY - stemHeight * 0.55})"/>`;
        }

        // Daisy flower
        if (growth > 0.6) {
            const flowerSize = 13 * Math.min(1, (growth - 0.6) / 0.4);
            const flowerY = stemY - stemHeight;

            // White petals
            for (let i = 0; i < 14; i++) {
                const angle = (i * 25.7) * Math.PI / 180;
                const petalX = x + Math.cos(angle) * flowerSize * 0.5;
                const petalY = flowerY + Math.sin(angle) * flowerSize * 0.5;
                svg += `<ellipse cx="${petalX}" cy="${petalY}" rx="${flowerSize * 0.25}" ry="${flowerSize * 0.13}"
                    fill="${colors.petal}" stroke="${colors.petal}" stroke-width="0.4"
                    transform="rotate(${i * 25.7} ${petalX} ${petalY})"/>`;
            }

            // Yellow center
            svg += `<circle cx="${x}" cy="${flowerY}" r="${flowerSize * 0.3}" fill="${colors.center}"/>`;
        }

        return svg;
    }

    function generateHibiscus(x, baseY, growth, colors) {
        let svg = '';
        const stemHeight = 62 * growth;
        const stemY = baseY - 10;

        // Woody stem
        if (growth > 0.1) {
            svg += `<line x1="${x}" y1="${stemY}" x2="${x}" y2="${stemY - stemHeight}"
                stroke="${colors.stem}" stroke-width="2.5" stroke-linecap="round"/>`;
        }

        // Large tropical leaves
        if (growth > 0.3) {
            const leafSize = 11 * Math.min(1, (growth - 0.3) / 0.3);
            svg += `<path d="M ${x - 6} ${stemY - stemHeight * 0.4} q ${-leafSize} ${0} ${-leafSize * 0.8} ${leafSize}
                q ${leafSize * 0.3} ${leafSize * 0.2} ${leafSize * 0.8} ${-leafSize}"
                fill="${colors.leaf}" stroke="${colors.stem}" stroke-width="0.8"/>`;
            svg += `<path d="M ${x + 6} ${stemY - stemHeight * 0.6} q ${leafSize} ${0} ${leafSize * 0.8} ${leafSize}
                q ${-leafSize * 0.3} ${leafSize * 0.2} ${-leafSize * 0.8} ${-leafSize}"
                fill="${colors.leaf}" stroke="${colors.stem}" stroke-width="0.8"/>`;
        }

        // Large hibiscus bloom
        if (growth > 0.65) {
            const bloomSize = 18 * Math.min(1, (growth - 0.65) / 0.35);
            const bloomY = stemY - stemHeight;

            // 5 large petals
            for (let i = 0; i < 5; i++) {
                const angle = (i * 72 - 90) * Math.PI / 180;
                const petalX = x + Math.cos(angle) * bloomSize * 0.35;
                const petalY = bloomY + Math.sin(angle) * bloomSize * 0.35;
                svg += `<ellipse cx="${petalX}" cy="${petalY}" rx="${bloomSize * 0.4}" ry="${bloomSize * 0.35}"
                    fill="${colors.petal}" opacity="0.9" transform="rotate(${i * 72 - 90} ${petalX} ${petalY})"/>`;
            }

            // Long stamen
            svg += `<line x1="${x}" y1="${bloomY}" x2="${x}" y2="${bloomY - bloomSize * 0.5}"
                stroke="${colors.center}" stroke-width="1.5"/>`;
            svg += `<circle cx="${x}" cy="${bloomY - bloomSize * 0.5}" r="2.5" fill="${colors.center}"/>`;
        }

        return svg;
    }

    function generateLotus(x, baseY, growth, colors) {
        let svg = '';
        const stemHeight = 50 * growth;
        const stemY = baseY - 10;

        // Curved stem
        if (growth > 0.1) {
            svg += `<path d="M ${x} ${stemY} Q ${x + 2.5} ${stemY - stemHeight * 0.5} ${x} ${stemY - stemHeight}"
                stroke="${colors.stem}" stroke-width="2" fill="none"/>`;
        }

        // Round lily pad leaves
        if (growth > 0.35) {
            const leafSize = 13 * Math.min(1, (growth - 0.35) / 0.3);
            svg += `<ellipse cx="${x - 10}" cy="${stemY - stemHeight * 0.3}" rx="${leafSize}" ry="${leafSize * 0.7}"
                fill="${colors.leaf}" opacity="0.8"/>`;
            svg += `<circle cx="${x + 8}" cy="${stemY - stemHeight * 0.5}" r="${leafSize * 0.7}"
                fill="${colors.leaf}" opacity="0.8"/>`;
        }

        // Lotus flower
        if (growth > 0.6) {
            const flowerSize = 16 * Math.min(1, (growth - 0.6) / 0.4);
            const flowerY = stemY - stemHeight;

            // Outer layer petals
            for (let i = 0; i < 8; i++) {
                const angle = (i * 45) * Math.PI / 180;
                const petalX = x + Math.cos(angle) * flowerSize * 0.4;
                const petalY = flowerY + Math.sin(angle) * flowerSize * 0.4;
                svg += `<ellipse cx="${petalX}" cy="${petalY}" rx="${flowerSize * 0.35}" ry="${flowerSize * 0.22}"
                    fill="${colors.petal}" opacity="0.85" transform="rotate(${i * 45} ${petalX} ${petalY})"/>`;
            }

            // Inner layer
            for (let i = 0; i < 6; i++) {
                const angle = (i * 60 + 30) * Math.PI / 180;
                const petalX = x + Math.cos(angle) * flowerSize * 0.22;
                const petalY = flowerY + Math.sin(angle) * flowerSize * 0.22;
                svg += `<ellipse cx="${petalX}" cy="${petalY}" rx="${flowerSize * 0.25}" ry="${flowerSize * 0.18}"
                    fill="${colors.petal}" opacity="0.95" transform="rotate(${i * 60} ${petalX} ${petalY})"/>`;
            }

            // Seed pod center
            svg += `<ellipse cx="${x}" cy="${flowerY}" rx="${flowerSize * 0.13}" ry="${flowerSize * 0.17}"
                fill="${colors.center}"/>`;
        }

        return svg;
    }

    function generateCherryBlossom(x, baseY, growth, colors) {
        let svg = '';
        const stemHeight = 58 * growth;
        const stemY = baseY - 10;

        // Branch-like stem
        if (growth > 0.1) {
            svg += `<path d="M ${x} ${stemY} L ${x - 1.5} ${stemY - stemHeight * 0.6} L ${x} ${stemY - stemHeight}"
                stroke="${colors.stem}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
        }

        // Small branch leaves
        if (growth > 0.35) {
            const leafSize = 7 * Math.min(1, (growth - 0.35) / 0.3);
            svg += `<ellipse cx="${x - 6}" cy="${stemY - stemHeight * 0.5}" rx="${leafSize}" ry="${leafSize * 0.6}"
                fill="${colors.leaf}" transform="rotate(-20 ${x - 6} ${stemY - stemHeight * 0.5})"/>`;
            svg += `<ellipse cx="${x + 5}" cy="${stemY - stemHeight * 0.7}" rx="${leafSize}" ry="${leafSize * 0.6}"
                fill="${colors.leaf}" transform="rotate(20 ${x + 5} ${stemY - stemHeight * 0.7})"/>`;
        }

        // Cherry blossoms
        if (growth > 0.6) {
            const flowerSize = 10 * Math.min(1, (growth - 0.6) / 0.4);
            const positions = [
                { x: x, y: stemY - stemHeight },
                { x: x - 8, y: stemY - stemHeight * 0.85 },
                { x: x + 6, y: stemY - stemHeight * 0.9 }
            ];

            positions.forEach(pos => {
                // 5 petals per blossom
                for (let i = 0; i < 5; i++) {
                    const angle = (i * 72 - 90) * Math.PI / 180;
                    const petalX = pos.x + Math.cos(angle) * flowerSize * 0.35;
                    const petalY = pos.y + Math.sin(angle) * flowerSize * 0.35;
                    svg += `<ellipse cx="${petalX}" cy="${petalY}" rx="${flowerSize * 0.3}" ry="${flowerSize * 0.25}"
                        fill="${colors.petal}" opacity="0.9" transform="rotate(${i * 72 - 90} ${petalX} ${petalY})"/>`;
                }
                // Center
                svg += `<circle cx="${pos.x}" cy="${pos.y}" r="${flowerSize * 0.12}" fill="${colors.center}"/>`;
            });
        }

        return svg;
    }

    function generateCactus(x, baseY, growth, colors) {
        let svg = '';
        const bodyHeight = 60 * growth;
        const bodyY = baseY - 10;

        // Main cactus body
        if (growth > 0.1) {
            const bodyWidth = 10;
            svg += `<rect x="${x - bodyWidth / 2}" y="${bodyY - bodyHeight}" width="${bodyWidth}" height="${bodyHeight}"
                fill="${colors.stem}" rx="5" ry="5"/>`;

            // Vertical line details
            svg += `<line x1="${x - 2.5}" y1="${bodyY - bodyHeight}" x2="${x - 2.5}" y2="${bodyY}"
                stroke="${colors.leaf}" stroke-width="0.8" opacity="0.5"/>`;
            svg += `<line x1="${x + 2.5}" y1="${bodyY - bodyHeight}" x2="${x + 2.5}" y2="${bodyY}"
                stroke="${colors.leaf}" stroke-width="0.8" opacity="0.5"/>`;
        }

        // Side arms
        if (growth > 0.4) {
            const armHeight = 20 * Math.min(1, (growth - 0.4) / 0.3);
            const armY = bodyY - bodyHeight * 0.6;

            // Left arm
            svg += `<rect x="${x - 15}" y="${armY}" width="6" height="${armHeight}"
                fill="${colors.stem}" rx="3" ry="3"/>`;
            svg += `<rect x="${x - 10}" y="${armY + armHeight - 6}" width="5" height="6"
                fill="${colors.stem}" rx="2.5" ry="2.5"/>`;

            // Right arm
            svg += `<rect x="${x + 9}" y="${armY + 4}" width="6" height="${armHeight - 4}"
                fill="${colors.stem}" rx="3" ry="3"/>`;
            svg += `<rect x="${x + 5}" y="${armY + armHeight}" width="5" height="6"
                fill="${colors.stem}" rx="2.5" ry="2.5"/>`;
        }

        // Spines
        if (growth > 0.25) {
            const spineCount = Math.floor(growth * 10);
            for (let i = 0; i < spineCount; i++) {
                const sy = bodyY - bodyHeight * (0.15 + (i / spineCount) * 0.7);
                svg += `<line x1="${x - 5}" y1="${sy}" x2="${x - 7}" y2="${sy - 2}"
                    stroke="#fff" stroke-width="0.8" opacity="0.6"/>`;
                svg += `<line x1="${x + 5}" y1="${sy + 1.5}" x2="${x + 7}" y2="${sy - 0.5}"
                    stroke="#fff" stroke-width="0.8" opacity="0.6"/>`;
            }
        }

        // Flower on top
        if (growth > 0.75) {
            const flowerSize = 8 * Math.min(1, (growth - 0.75) / 0.25);
            const flowerY = bodyY - bodyHeight - 4;

            for (let i = 0; i < 6; i++) {
                const angle = (i * 60) * Math.PI / 180;
                const petalX = x + Math.cos(angle) * flowerSize * 0.35;
                const petalY = flowerY + Math.sin(angle) * flowerSize * 0.35;
                svg += `<circle cx="${petalX}" cy="${petalY}" r="${flowerSize * 0.25}" fill="${colors.petal}"/>`;
            }
            svg += `<circle cx="${x}" cy="${flowerY}" r="${flowerSize * 0.2}" fill="${colors.center}"/>`;
        }

        return svg;
    }

    function generateGenericPlant(x, baseY, growth, colors) {
        let svg = '';
        const stemHeight = 60 * growth;
        const stemY = baseY - 10;

        if (growth > 0.1) {
            svg += `<line x1="${x}" y1="${stemY}" x2="${x}" y2="${stemY - stemHeight}"
                stroke="${colors.stem}" stroke-width="2"/>`;
        }

        if (growth > 0.5) {
            const flowerSize = 12 * Math.min(1, (growth - 0.5) / 0.5);
            const flowerY = stemY - stemHeight;
            svg += `<circle cx="${x}" cy="${flowerY}" r="${flowerSize}" fill="${colors.petal}"/>`;
            svg += `<circle cx="${x}" cy="${flowerY}" r="${flowerSize * 0.4}" fill="${colors.center}"/>`;
        }

        return svg;
    }

    function plantSeed(potIndex) {
        const selectedSeedType = plantGameState.selectedSeed;
        const seedCount = plantGameState.resources.seeds[selectedSeedType];

        if (seedCount <= 0) {
            alert('You don\'t have any of these seeds! Complete more work sessions to unlock and collect seeds.');
            return;
        }

        plantGameState.garden[potIndex] = {
            type: selectedSeedType,
            growth: 0,
            plantedAt: Date.now(),
            lastWatered: Date.now(),
            isFertilized: false,
            isFullyGrown: false
        };

        plantGameState.resources.seeds[selectedSeedType]--;

        renderGarden();
        updateResourceDisplay();
        saveGameState();
    }

    function interactWithPlant(potIndex) {
        const plant = plantGameState.garden[potIndex];
        if (!plant) return;

        const seedType = SEED_TYPES.find(s => s.id === plant.type);

        if (plant.growth >= 100) {
            // Harvest
            harvestPlant(potIndex);
        } else {
            // Show plant info or fertilize options
            const action = confirm(`${seedType.name} - Growth: ${Math.floor(plant.growth)}%\n\nWould you like to fertilize this plant? (Costs 1 fertilizer, speeds up growth)`);
            if (action && plantGameState.resources.fertilizer > 0 && !plant.isFertilized) {
                plant.isFertilized = true;
                plantGameState.resources.fertilizer--;
                plant.growth = Math.min(100, plant.growth + 20); // Instant 20% growth boost
                renderGarden();
                updateResourceDisplay();
                saveGameState();
            }
        }
    }

    function harvestPlant(potIndex) {
        const plant = plantGameState.garden[potIndex];
        const seedType = SEED_TYPES.find(s => s.id === plant.type);

        // Give rewards
        const seedsEarned = Math.floor(Math.random() * 2) + 2; // 2-3 seeds
        plantGameState.resources.seeds[plant.type] += seedsEarned;
        plantGameState.stats.plantsHarvested++;

        // Remove plant
        plantGameState.garden[potIndex] = null;

        showNotification('🎉 Harvest Complete!', `You harvested a ${seedType.name} and got ${seedsEarned} seeds!`);

        renderGarden();
        updateResourceDisplay();
        updateStatsDisplay();
        checkUnlockedSeeds();
        saveGameState();
    }

    // ===== SEED SELECTOR =====
    function renderSeedSelector() {
        const grid = document.getElementById('seedGrid');
        grid.innerHTML = '';

        SEED_TYPES.forEach(seed => {
            const isUnlocked = plantGameState.stats.plantsHarvested >= seed.unlockAt;
            const isSelected = plantGameState.selectedSeed === seed.id;
            const seedCount = plantGameState.resources.seeds[seed.id] || 0;

            const card = document.createElement('div');
            card.className = `seed-card ${isSelected ? 'selected' : ''} ${!isUnlocked ? 'locked' : ''}`;

            if (isUnlocked) {
                // Show mini plant preview
                const miniPlantSVG = `
                    <div style="width: 40px; height: 50px; margin: 5px auto;">
                        ${generatePlantSVG(seed, 100)}
                    </div>
                `;
                card.innerHTML = `
                    ${miniPlantSVG}
                    <div class="seed-name">${seed.name}</div>
                    <div style="font-size: 0.75rem; color: #6b21a8; margin-top: 5px;">
                        x${seedCount}
                    </div>
                `;

                card.onclick = () => {
                    plantGameState.selectedSeed = seed.id;
                    renderSeedSelector();
                    saveGameState();
                };
            } else {
                card.innerHTML = `
                    <span class="seed-icon">🔒</span>
                    <div class="seed-name">${seed.name}</div>
                    <div style="font-size: 0.75rem; color: #6b21a8; margin-top: 5px;">
                        Unlock: ${seed.unlockAt}
                    </div>
                `;
            }

            grid.appendChild(card);
        });
    }

    function checkUnlockedSeeds() {
        SEED_TYPES.forEach(seed => {
            if (plantGameState.stats.plantsHarvested === seed.unlockAt && seed.unlockAt > 0) {
                plantGameState.resources.seeds[seed.id] = 2; // Give starter seeds
                showNotification('🌟 New Seed Unlocked!', `You've unlocked ${seed.name} ${seed.icon}!`);
            }
        });
        renderSeedSelector();
    }

    // ===== NOTIFICATIONS =====
    function requestNotificationPermission() {
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }
    }

    function checkPendingNotifications() {
        const now = Date.now();

        // Water notification
        if (now - plantGameState.intervals.lastWater >= WATER_INTERVAL * 1000) {
            showNotification('💧 Time to Water!', 'Your plants need water! Don\'t forget to drink some water too!');
            sendBrowserNotification('💧 Time to Water!', 'Your plants need water! Stay hydrated!');
            plantGameState.intervals.lastWater = now;
            saveGameState();
        }

        // Fertilize notification
        if (now - plantGameState.intervals.lastFertilize >= FERTILIZE_INTERVAL * 1000) {
            showNotification('🥄 Time to Eat & Fertilize!', 'Take a break, eat something, and fertilize your plants!');
            sendBrowserNotification('🥄 Time to Eat!', 'Take a break and eat something nutritious!');
            plantGameState.intervals.lastFertilize = now;
            saveGameState();
        }
    }

    function showNotification(title, message) {
        const popup = document.getElementById('notificationPopup');
        document.getElementById('notifTitle').textContent = title;
        document.getElementById('notifMessage').textContent = message;
        popup.classList.add('show');

        // Auto-close after 10 seconds
        setTimeout(() => {
            if (popup.classList.contains('show')) {
                popup.classList.remove('show');
            }
        }, 10000);
    }

    function closeNotification() {
        document.getElementById('notificationPopup').classList.remove('show');
    }

    function sendBrowserNotification(title, body) {
        if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(title, {
                body: body,
                icon: '🌱',
                badge: '🌱'
            });
        }
    }

    // ===== RESOURCE MANAGEMENT =====
    function updateResourceDisplay() {
        // Resources are now only tracked internally, no display needed
    }

    function updateStatsDisplay() {
        // Stats are now only tracked internally, no display needed
    }

    function checkDailyReset() {
        const now = Date.now();
        const lastRefresh = plantGameState.intervals.lastFertilizerRefresh;
        const oneDayMs = 24 * 60 * 60 * 1000;

        if (now - lastRefresh >= oneDayMs) {
            plantGameState.resources.fertilizer = 5;
            plantGameState.intervals.lastFertilizerRefresh = now;
            showNotification('🎁 Daily Refresh!', 'Your fertilizer has been replenished!');
            updateResourceDisplay();
            saveGameState();
        }
    }

    // ===== PERSISTENCE =====
    function saveGameState() {
        localStorage.setItem('plantGame_state', JSON.stringify(plantGameState));
    }

    function loadGameState() {
        const saved = localStorage.getItem('plantGame_state');
        if (saved) {
            const loaded = JSON.parse(saved);
            plantGameState = { ...plantGameState, ...loaded };

            // Reset timer state on load
            plantGameState.timer.isRunning = false;
            plantGameState.timer.isPaused = false;
            plantGameState.timer.remaining = WORK_SESSION_DURATION;
        }
    }

    // Initialize plant game when page loads
    setTimeout(() => {
        initPlantGame();
    }, 500);
</script>

    <script>
        // Toggle settings dropdown
        function toggleSettings() {
            const menu = document.getElementById('settingsMenu');
            menu.classList.toggle('show');
        }

        // Close settings menu when clicking outside
        document.addEventListener('click', function(event) {
            const settingsDropdown = document.querySelector('.settings-dropdown');
            const menu = document.getElementById('settingsMenu');

            if (settingsDropdown && !settingsDropdown.contains(event.target)) {
                menu.classList.remove('show');
            }
        });

        // Save settings to localStorage
        function saveSettings() {
            const passwordGameDisabled = document.getElementById('disablePasswordGame').checked;
            const musicDisabled = document.getElementById('disableBackgroundMusic').checked;

            localStorage.setItem('invitation_disablePasswordGame', passwordGameDisabled);
            localStorage.setItem('invitation_disableBackgroundMusic', musicDisabled);

            console.log('Settings saved:', { passwordGameDisabled, musicDisabled });
        }

        // Load settings from localStorage
        function loadSettings() {
            const passwordGameDisabled = localStorage.getItem('invitation_disablePasswordGame') === 'true';
            const musicDisabled = localStorage.getItem('invitation_disableBackgroundMusic') === 'true';

            const passwordGameCheckbox = document.getElementById('disablePasswordGame');
            const musicCheckbox = document.getElementById('disableBackgroundMusic');

            if (passwordGameCheckbox) passwordGameCheckbox.checked = passwordGameDisabled;
            if (musicCheckbox) musicCheckbox.checked = musicDisabled;
        }

        // Load settings on page load
        window.addEventListener('DOMContentLoaded', loadSettings);
    </script>
