<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Limelight&family=Jacquard+24&family=Quintessential&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Theme Colors */
            --color-primary: #123524;
            --color-secondary: #00a767;
            --color-accent: #eefdf4;
            --color-background: #e8f3f5;
            --color-white: #ffffff;
            --color-text-primary: #e8f3f5;
            --color-text-secondary: #eefdf4;
            --color-text-muted: #718096;
            --color-nav-bg: #123524;
            --color-hover-light: #c8e6d3;
            --color-hover-dark: #0a1f16;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            color: var(--color-nav-bg);
            min-height: 100vh;
            position: relative;
            padding-top: 90px;
            animation: backgroundCycle 30s ease-in-out infinite;
        }

        @keyframes backgroundCycle {
            0%, 100% {
                background: #F0FCF5;
            }
            33% {
                background: #E8F3F5;
            }
            66% {
                background: #9CB0A4;
            }
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--color-nav-bg);
            backdrop-filter: blur(10px);
            padding: 1rem 5%;
            box-shadow: 0 2px 20px rgba(18, 53, 36, 0.3);
            z-index: 1000;
        }

        nav .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            color: var(--color-text-primary);
            text-decoration: none;
            transition: all 0.3s;
        }

        nav .logo:hover {
            color: var(--color-hover-light);
        }

        nav .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        nav .nav-links a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
            padding: 0.5rem 1rem;
            border-radius: 8px;
        }

        nav .nav-links a:hover {
            color: var(--color-hover-dark);
            background: rgba(18, 53, 36, 0.1);
        }

        /* Full-Page Hero Banner */
        .invitation-banner {
            min-height: calc(100vh - 90px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 5%;
            position: relative;
        }

        .invitation-banner h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .invitation-banner p {
            font-size: 2rem;
            color: var(--color-primary);
            font-weight: 400;
        }

        /* Scroll Down Button */
        .scroll-down-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--color-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            animation: bounce 2s infinite;
        }

        .scroll-down-btn .material-symbols-outlined {
            font-size: 3rem;
        }

        .scroll-down-btn:hover {
            transform: translateX(-50%) translateY(5px);
            color: var(--color-secondary);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(-10px);
            }
            60% {
                transform: translateX(-50%) translateY(-5px);
            }
        }

        /* Content Area */
        .invitation-main {
            min-height: calc(100vh - 300px);
            padding: 20px 5%;
        }

        /* Decorative Elements */
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            top: 10%;
            left: 10%;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--color-text-secondary) 0%, transparent 70%);
            animation-delay: 0s;
        }

        .shape-2 {
            top: 60%;
            right: 15%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, var(--color-secondary) 0%, transparent 70%);
            animation-delay: 5s;
        }

        .shape-3 {
            bottom: 20%;
            left: 20%;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, var(--color-secondary) 0%, transparent 70%);
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(20px, -20px) rotate(90deg);
            }
            50% {
                transform: translate(-15px, 15px) rotate(180deg);
            }
            75% {
                transform: translate(15px, 20px) rotate(270deg);
            }
        }

        /* Settings Dropdown */
        .settings-dropdown {
            position: relative;
        }

        .settings-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            padding: 0.5rem;
            transition: transform 0.3s;
            color: var(--color-text-primary);
        }

        .settings-btn:hover {
            transform: rotate(45deg);
        }

        .settings-icon {
            display: block;
        }

        .settings-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 0.5rem;
            background: var(--color-white);
            border-radius: 12px;
            padding: 1rem;
            min-width: 250px;
            box-shadow: 0 8px 24px rgba(18, 53, 36, 0.25);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s;
            z-index: 1001;
        }

        .settings-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .settings-item {
            padding: 0.75rem 0;
        }

        .settings-item label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            color: var(--color-primary);
            font-weight: 500;
        }

        .settings-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--color-primary);
        }

        .settings-item span {
            user-select: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            nav .nav-links {
                gap: 1rem;
                font-size: 0.9rem;
            }

            .invitation-banner h1 {
                font-size: 3.5rem;
            }

            .invitation-banner p {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            nav {
                padding: 0.8rem 5%;
            }

            nav .logo {
                font-size: 1.3rem;
            }

            nav .nav-links {
                gap: 0.5rem;
                font-size: 0.85rem;
            }

            nav .nav-links a {
                padding: 0.4rem 0.6rem;
            }

            .invitation-banner h1 {
                font-size: 2.5rem;
            }

            .invitation-banner p {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Decorative Shapes -->
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Pastel Navigation -->
    <nav>
        <div class="nav-container">
            <a href="/invitation/" class="logo"> Hub</a>
            <div class="settings-dropdown">
                <button class="settings-btn" onclick="toggleSettings()">
                    <span class="material-symbols-outlined settings-icon">settings</span>
                </button>
                <div class="settings-menu" id="settingsMenu">
                    <div class="settings-item">
                        <label>
                            <input type="checkbox" id="disablePasswordGame" onchange="saveSettings()">
                            <span>Disable Password Game</span>
                        </label>
                    </div>
                    <div class="settings-item">
                        <label>
                            <input type="checkbox" id="disableBackgroundMusic" onchange="saveSettings()">
                            <span>Disable Background Music</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="invitation-main" id="main-content">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<style>
    :root {
        /* Theme Colors */
        --color-primary: #123524;
        --color-secondary: #00a767;
        --color-accent: #eefdf4;
        --color-background: #e8f3f5;
        --color-white: #ffffff;
        --color-text-primary: #e8f3f5;
        --color-text-secondary: #eefdf4;
        --color-text-muted: #718096;
        --color-border-accent: #a8d5ba;
    }

    .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }

    .section-view {
        padding: 20px;
        max-width: 900px;
        margin: 0 auto;
    }

    .section-view h1 {
        font-size: 2.5rem;
        color: var(--color-primary);
        margin-bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .section-view h1 .material-symbols-outlined {
        font-size: 2.5rem;
    }

    /* Photo Gallery Styles */
    .section-description {
        text-align: center;
        color: var(--color-text-secondary);
        margin-bottom: 2rem;
    }

    .photo-gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
        margin-top: 2rem;
    }

    .photo-item {
        position: relative;
        aspect-ratio: 1;
        border-radius: 16px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 12px rgba(18, 53, 36, 0.15);
    }

    .photo-item:hover {
        transform: translateY(-5px) scale(1.02);
        box-shadow: 0 8px 24px rgba(18, 53, 36, 0.25);
    }

    .photo-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s;
    }

    .photo-item:hover img {
        transform: scale(1.1);
    }

    .empty-gallery {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px 20px;
        background: linear-gradient(135deg, #f5fdf8 0%, #edf9f1 100%);
        border-radius: 16px;
        border: 2px dashed var(--color-border-accent);
    }

    .empty-gallery p {
        color: var(--color-text-secondary);
        font-size: 1rem;
    }

    .empty-gallery code {
        background: rgba(18, 53, 36, 0.1);
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.9rem;
        color: var(--color-primary);
    }

    /* Lightbox Styles */
    .lightbox {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 2000;
        cursor: pointer;
        animation: fadeIn 0.3s;
    }

    .lightbox.active {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .lightbox-close {
        position: absolute;
        top: 20px;
        right: 30px;
        font-size: 3rem;
        color: white;
        cursor: pointer;
        transition: color 0.3s;
    }

    .lightbox-close:hover {
        color: var(--color-border-accent);
    }

    .lightbox-image {
        max-width: 90%;
        max-height: 80vh;
        object-fit: contain;
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .lightbox-caption {
        color: white;
        margin-top: 20px;
        font-size: 1.1rem;
        text-align: center;
        max-width: 80%;
    }

    .lightbox-arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.3);
        color: white;
        font-size: 3rem;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2001;
    }

    .lightbox-arrow:hover {
        background: rgba(168, 213, 186, 0.3);
        border-color: var(--color-border-accent);
        transform: translateY(-50%) scale(1.1);
    }

    .lightbox-arrow-left {
        left: 30px;
    }

    .lightbox-arrow-right {
        right: 30px;
    }

    @media (max-width: 768px) {
        .lightbox-arrow {
            width: 45px;
            height: 45px;
            font-size: 2rem;
        }

        .lightbox-arrow-left {
            left: 15px;
        }

        .lightbox-arrow-right {
            right: 15px;
        }
    }
</style>

<div class="section-view">
    <h1><span class="material-symbols-outlined">photo_camera</span> Memories</h1>
    <p class="section-description">A collection of cherished moments</p>

    <div class="photo-gallery" id="photoGallery">
        <!-- Photos will be loaded here -->
        <div class="empty-gallery">
            <p>No photos yet. Add images to <code>misc/invitation/memories/</code> folder.</p>
        </div>
    </div>

    <!-- Lightbox for full-size images -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <button class="lightbox-arrow lightbox-arrow-left" onclick="event.stopPropagation(); previousPhoto();" aria-label="Previous photo">‹</button>
        <button class="lightbox-arrow lightbox-arrow-right" onclick="event.stopPropagation(); nextPhoto();" aria-label="Next photo">›</button>
        <img class="lightbox-image" id="lightboxImage" src="" alt="" onclick="event.stopPropagation();" />
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>
</div>

<script>
    // Check authentication
    window.addEventListener('DOMContentLoaded', function() {
        if (sessionStorage.getItem('invitation_authenticated') !== 'true') {
            window.location.href = '/invitation/';
        }

        // Hide banner on section pages
        const banner = document.querySelector('.invitation-banner');
        if (banner) {
            banner.style.display = 'none';
        }

        loadPhotoGallery();
    });

    // Photo Gallery - Automatically generated from misc/invitation/memories folder
    const photos = [
        
        
            
            
        
            
            
                
                {
                    src: '/misc/invitation/memories/jonatan-pie-3l3RwQdHRHg-unsplash.jpg',
                    caption: 'Jonatan pie 3l3rwqdhrhg unsplash'
                },
            
        
            
            
        
            
            
                
                {
                    src: '/misc/invitation/memories/marc-marchal-fpaSXDuoHkc-unsplash.jpg',
                    caption: 'Marc marchal fpasxduohkc unsplash'
                },
            
        
            
            
        
            
            
                
                {
                    src: '/misc/invitation/memories/matthew-stephenson-8VvxbqE8ZX0-unsplash.jpg',
                    caption: 'Matthew stephenson 8vvxbqe8zx0 unsplash'
                },
            
        
            
            
        
            
            
                
                {
                    src: '/misc/invitation/memories/natalie-chaney-zhUzdTgtRP8-unsplash.jpg',
                    caption: 'Natalie chaney zhuzdtgtrp8 unsplash'
                },
            
        
            
            
        
    ];

    function loadPhotoGallery() {
        const gallery = document.getElementById('photoGallery');

        if (photos.length === 0) {
            return; // Show empty state
        }

        // Clear empty state
        gallery.innerHTML = '';

        photos.forEach((photo, index) => {
            const photoItem = document.createElement('div');
            photoItem.className = 'photo-item';
            photoItem.onclick = () => openLightbox(index);

            const img = document.createElement('img');
            img.src = photo.src;
            img.alt = photo.caption || 'Memory';
            img.loading = 'lazy';

            photoItem.appendChild(img);
            gallery.appendChild(photoItem);
        });
    }

    let currentPhotoIndex = 0;

    function openLightbox(index) {
        if (photos.length === 0) return;

        currentPhotoIndex = index;
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxCaption = document.getElementById('lightboxCaption');

        lightbox.classList.add('active');
        updateLightboxImage();

        // Add keyboard navigation
        document.addEventListener('keydown', handleLightboxKeyboard);
    }

    function updateLightboxImage() {
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxCaption = document.getElementById('lightboxCaption');

        lightboxImage.src = photos[currentPhotoIndex].src;
        lightboxCaption.textContent = photos[currentPhotoIndex].caption || '';
    }

    function nextPhoto() {
        if (photos.length === 0) return;
        currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
        updateLightboxImage();
    }

    function previousPhoto() {
        if (photos.length === 0) return;
        currentPhotoIndex = (currentPhotoIndex - 1 + photos.length) % photos.length;
        updateLightboxImage();
    }

    function handleLightboxKeyboard(event) {
        if (event.key === 'ArrowRight') {
            event.preventDefault();
            nextPhoto();
        } else if (event.key === 'ArrowLeft') {
            event.preventDefault();
            previousPhoto();
        } else if (event.key === 'Escape') {
            event.preventDefault();
            closeLightbox();
        }
    }

    function closeLightbox() {
        const lightbox = document.getElementById('lightbox');
        lightbox.classList.remove('active');

        // Remove keyboard navigation
        document.removeEventListener('keydown', handleLightboxKeyboard);
    }
</script>


    </main>

    <script>
        // Toggle settings dropdown
        function toggleSettings() {
            const menu = document.getElementById('settingsMenu');
            menu.classList.toggle('show');
        }

        // Close settings menu when clicking outside
        document.addEventListener('click', function(event) {
            const settingsDropdown = document.querySelector('.settings-dropdown');
            const menu = document.getElementById('settingsMenu');

            if (settingsDropdown && !settingsDropdown.contains(event.target)) {
                menu.classList.remove('show');
            }
        });

        // Save settings to localStorage
        function saveSettings() {
            const passwordGameDisabled = document.getElementById('disablePasswordGame').checked;
            const musicDisabled = document.getElementById('disableBackgroundMusic').checked;

            localStorage.setItem('invitation_disablePasswordGame', passwordGameDisabled);
            localStorage.setItem('invitation_disableBackgroundMusic', musicDisabled);

            console.log('Settings saved:', { passwordGameDisabled, musicDisabled });
        }

        // Load settings from localStorage
        function loadSettings() {
            const passwordGameDisabled = localStorage.getItem('invitation_disablePasswordGame') === 'true';
            const musicDisabled = localStorage.getItem('invitation_disableBackgroundMusic') === 'true';

            const passwordGameCheckbox = document.getElementById('disablePasswordGame');
            const musicCheckbox = document.getElementById('disableBackgroundMusic');

            if (passwordGameCheckbox) passwordGameCheckbox.checked = passwordGameDisabled;
            if (musicCheckbox) musicCheckbox.checked = musicDisabled;
        }

        // Load settings on page load
        window.addEventListener('DOMContentLoaded', loadSettings);
    </script>

</body>
</html>
